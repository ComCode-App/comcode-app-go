      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeResourceMeta" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/leads:
    # Leads belong to the active account (docs/TENANCY_AND_ACCESS.md): other accounts' leads are 404;
    # mark-read and delete need an owner/admin account role (403 otherwise). Reads are scoped by
    # account role (TEC-940): owners and admins see every lead, other members only those of their
    # own employee profile or of a card pointing at it; the rest are 404 / not listed.
    get:
      tags: [Leads]
      operationId: listLeads
      summary: List the leads the caller may read in the active account, newest first
      description: |
        Requires `app.leads.read`. `q` searches name, email, phone and company (a locked lead only by
        company). Owners and admins get the whole account; other members only leads of their own
        profile or card (TEC-940). Locked leads (TEC-941) come with `locked: true` and their name,
        email and phone masked (`A*** Y***`, `a***@***`, `*** 33`), message and sender empty. Before
        the read, a new month unlocks every earlier locked lead and a plan upgrade unlocks the month's
        oldest ones up to the new quota; an unlocked lead never locks again.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: source_type
          in: query
          schema: { $ref: "#/components/schemas/LeadSource" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/LeadKind" }
        - name: unread
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Paginated leads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeLeadPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/leads/export:
    post:
      tags: [Leads]
      operationId: exportLeads
      summary: Queue an export of the active account's leads
      description: |
        Export job of resource `app.leads` for the caller's active account (the account and the viewer
        come from the token; the file holds what `GET /v1/leads` would list for the caller). `query` takes the list filters `q`, `source_type` and `unread`. Download it from
        `/v1/exports/{uuid}/download`. Requires `app.leads.read` and step-up (the file holds personal data).
        Each request takes one export from the account's monthly `leads.export.monthly_max` quota
        (TEC-941); once it is used up, or when the plan sets 0, the answer is 403
        `PLAN_LIMIT_EXCEEDED` with `error.details[0].field` = `leads.export.monthly_max`. Locked leads
        are masked in the file as in the list and carry `locked: true`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format: { type: string, enum: [pdf, xlsx, csv, json] }
                locale: { type: string, enum: [tr, en], default: tr }
                query:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "202":
          description: Export job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeGeneric" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/leads/{uuid}:
    get:
      tags: [Leads]
      operationId: getLead
      summary: One lead of the active account
      description: Requires `app.leads.read`. 404 for a lead the caller's role may not read (TEC-940).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
