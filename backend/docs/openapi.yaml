        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/profiles/{uuid}/public-page:
    get:
      tags: [Profiles]
      operationId: getProfilePublicPage
      summary: Public page settings of a profile
      description: Username, visibility, visible modules and published bank accounts. Assigns a username if the profile has none.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopePublicPageSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Profiles]
      operationId: updateProfilePublicPage
      summary: Change a profile's public page
      description: |
        Owner/admin of the active account. Omitted fields stay unchanged. Renaming retires the
        old username: it keeps redirecting to the new one and cannot be taken by others.
        Bank accounts must belong to the active account.
        Picking a premium theme or a premium background (one that differs from the stored value)
        needs the `design.premium` entitlement: 403 `PLAN_LIMIT_EXCEEDED` with
        `error.details[0].field` = `design.premium` otherwise (TEC-947). A stored premium choice
        is kept after a downgrade and may be re-sent unchanged.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePublicPageRequest" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopePublicPageSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/profiles/{uuid}/verification:
    # Scoped to the active account (other accounts' profiles are 404). Request and cancel need
    # app.profiles.write and an owner/admin account role (403 otherwise).
    get:
      tags: [Profile Verifications]
      operationId: getProfileVerification
      summary: Verified badge status of a profile
      description: Requires `app.profiles.read`. Returns the status and the latest request (owner-safe fields only).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Verification view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeProfileVerification" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Profile Verifications]
      operationId: requestProfileVerification
      summary: Ask the platform to verify a profile
      description: |
        Requires `app.profiles.write` and an owner/admin account role. Allowed when the status is
        `none` or `rejected`; a pending or verified profile answers 409. The optional note is shown
        to the reviewer.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestProfileVerificationRequest" }
      responses:
        "201":
          description: Request opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeProfileVerification" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Profile Verifications]
      operationId: cancelProfileVerification
      summary: Withdraw the pending verification request
      description: Requires `app.profiles.write` and an owner/admin account role. 409 when nothing is pending.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Request cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeProfileVerification" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/platform/profile-verifications:
    get:
      tags: [Profile Verifications]
      operationId: listProfileVerifications
      summary: Verification requests of all accounts
      description: |
        Requires `platform.profile_verifications.manage`. Pending requests first (oldest first).
        `q` searches profile names, organization, username and account name. Requests of deleted
        profiles are not listed.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ProfileVerificationRequestStatus" }
      responses:
        "200":
          description: Paginated requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeProfileVerificationReviewPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/platform/profile-verifications/{uuid}:
    get:
      tags: [Profile Verifications]
      operationId: getProfileVerificationReview
      summary: One verification request
      description: Requires `platform.profile_verifications.manage`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeProfileVerificationReview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/platform/profile-verifications/{uuid}/approve:
    post:
      tags: [Profile Verifications]
      operationId: approveProfileVerification
      summary: Approve a pending request
      description: |
        Requires `platform.profile_verifications.manage`. The profile shows the verified badge on its
        public page; the account's owners and admins are notified (in-app and email). 409 when the
        request is not pending.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Approved request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeProfileVerificationReview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/platform/profile-verifications/{uuid}/reject:
    post:
      tags: [Profile Verifications]
      operationId: rejectProfileVerification
      summary: Reject a pending request
      description: |
        Requires `platform.profile_verifications.manage`. `reason` is required and shown to the owner,
        who is notified (in-app and email) and may request again. 409 when the request is not pending.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileVerificationReasonRequest" }
      responses:
        "200":
          description: Rejected request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeProfileVerificationReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/platform/profile-verifications/{uuid}/revoke:
    post:
      tags: [Profile Verifications]
      operationId: revokeProfileVerification
      summary: Remove the badge of an approved request
      description: |
        Requires `platform.profile_verifications.manage`. `reason` is required; owners are notified
        in-app and may request again. 409 when the request is not approved.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileVerificationReasonRequest" }
      responses:
        "200":
          description: Revoked request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeProfileVerificationReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/public/p/{username}:
    get:
      tags: [Profiles]
      operationId: getPublicProfile
      summary: Visitor view of comcode.../{username}
      description: |
        No auth. Hidden modules come back empty; private fields (note, birthday, gender) are never
        included. A renamed username returns only `username` and `redirect_to`. Disabled pages,
        suspended accounts and unknown usernames are 404. Legacy hashes (including username
        collision aliases) return 307 to their destination; provenance is never exposed.
        Static app paths are blocked by the migration importer.
      security: []
      parameters:
        - name: src
          in: query
          description: Explicit QR marker. qr records card.qr.scan (card subject when present, otherwise route); analytics failure never changes resolution or access checks. Omit for NFC and ordinary visits.
          schema: { type: string, enum: [qr] }
        - name: via
          in: query
          description: |
            Card or smart link that opened the page (`c/{code}`, `s/{slug}`). An active smart link
            targeting this profile applies its presentation_config: theme, layout, primary action,
            and visible modules (only narrowing the owner's own selection; `social_hub` links show
            social links only). Anything else is ignored.
          schema: { type: string }
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopePublicProfile" }
        "307":
          description: Legacy card destination; no-store redirect
          headers:
            Location:
              schema: { type: string, format: uri }
              description: Absolute HTTP(S) destination
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/public/p/{username}/vcard:
    get:
      tags: [Profiles]
      operationId: downloadPublicProfileVCard
      summary: Visitor vCard of /{username}
      description: No auth. Follows the page's visible modules; a renamed username answers 301 to the new one.
      security: []
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
        - { name: locale, in: query, schema: { type: string, enum: [tr, en] } }
      responses:
        "200":
          description: vCard file attachment
          content:
            text/vcard:
              schema: { type: string }
        "301":
          description: Username was renamed; Location points at the new vCard URL
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/profiles/{uuid}/vcard:
    get:
      tags: [Profiles]
      operationId: downloadProfileVCard
      summary: Download profile vCard file (.vcf)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: locale
          in: query
          schema: { type: string, enum: [tr, en] }
        - name: version
          in: query
          schema: { type: string, enum: ["4.0"], default: "4.0" }
      responses:
        "200":
          description: vCard file attachment
          content:
            text/vcard:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/events:
    post:
      tags: [Events]
      operationId: ingestEvent
      summary: Ingest a polymorphic event
      description: Ingests an event into the asynchronous analytics pipeline with server-side context extraction.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEventRequest"
      responses:
        "202":
          description: Event accepted for background processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEventAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/platform/overview:
    get:
      tags: [Platform Overview]
      operationId: getPlatformOverview
      summary: Business KPIs for the platform home
      description: |
        Platform-wide (unscoped) KPIs for the `/platform` home (TEC-594): users, profiles, cards and
        activation rate, the order funnel of the last 30 days, subscription counts, MRR per
        currency (active subscriptions) and at-risk MRR (past_due subscriptions), the 10 most viewed profiles of the last 30 UTC days and the event volume of the
        last 24 hourly buckets. Analytics figures read `event_aggregates_daily` /
        `event_aggregates_hourly`, never raw events. The result is cached in Redis for 60 seconds
        (computed on every request when Redis is unavailable), so it can be up to a minute old;
        `generated_at` says when it was computed. Requires `platform.overview.read`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePlatformOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/platform/overview/funnel:
    get:
      tags: [Platform Overview]
      operationId: getPlatformConversionFunnel
      summary: Order conversion funnel for the platform home
      description: |
        Conversion of the orders created in the last `days` days (TEC-944), read from
        `order_status_history`: per stage (created → paid → in_production → shipped → delivered) the
        orders that reached it, the stage-to-stage and overall conversion rates, and the average
        hours from order creation to the stage. A stage counts as reached when the order entered
        that status or a later one of the lifecycle. History backfilled for orders that existed
        before the table counts as reached but carries no timing. Cached in Redis for 60 seconds
        per period. Requires `platform.overview.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, enum: [7, 30, 90, 365], default: 30 }
      responses:
        "200":
          description: Conversion funnel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePlatformConversionFunnel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/analytics/summary:
    get:
      tags: [Analytics]
      operationId: getAnalyticsSummary
      summary: Get analytics metric summary for a subject
      description: |
        Platform analytics readers may query any subject. Everyone else may only query a `route`,
        `card` or `profile` of the active account (404 otherwise), and `from` is clamped to the
        plan's `analytics.history_days`; the window is returned in `X-Analytics-History-Days`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subject_type
          in: query
          required: true
          schema: { type: string }
        - name: subject_id
          in: query
          required: true
          schema: { type: string }
        - name: event_type
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Summary metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAnalyticsSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/analytics/timeseries:
    get:
      tags: [Analytics]
      operationId: getAnalyticsTimeSeries
      summary: Get timeline data points for a subject
      description: |
        Platform analytics readers may query any subject. Everyone else may only query a `route`,
        `card` or `profile` of the active account (404 otherwise), and `from` is clamped to the
        plan's `analytics.history_days`; the window is returned in `X-Analytics-History-Days`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subject_type
          in: query
          required: true
          schema: { type: string }
        - name: subject_id
          in: query
          required: true
          schema: { type: string }
        - name: event_type
          in: query
          required: false
          schema: { type: string }
        - name: interval
          in: query
          required: false
          schema: { type: string, enum: [hour, day], default: day }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Time series points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAnalyticsTimeSeries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/analytics/breakdown:
    get:
      tags: [Analytics]
      operationId: getAnalyticsBreakdown
      summary: Get distribution breakdown by dimension
      description: |
        Platform analytics readers may query any subject. Everyone else may only query a `route`,
        `card` or `profile` of the active account (404 otherwise), and `from` is clamped to the
        plan's `analytics.history_days`; the window is returned in `X-Analytics-History-Days`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subject_type
          in: query
          required: true
          schema: { type: string }
        - name: subject_id
          in: query
          required: true
          schema: { type: string }
        - name: dimension
          in: query
          required: false
          schema: { type: string, enum: [country, city, device, browser, os, referer], default: country }
        - name: event_type
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Dimension breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAnalyticsBreakdown"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/analytics/sources:
    get:
      tags: [Analytics]
      operationId: getAnalyticsSources
      summary: Views, QR scans and entry source breakdown of a subject
      description: |
        TEC-953. Reads the daily rollups only. Counts the subject together with the subjects that
        lead to it, from the subject's own account: a `profile` brings its card routes, canonical
        route, smart links, legacy hash routes ("eski kart") and cards; a `route` its card; a
        `card` its routes. `views` counts page openings only (profile page views for a profile,
        route scans that were not QR-opened for a card or link); QR scans are never added to it.
        `sources` is always `qr`, `nfc`, `link`, `legacy` in this order. Route scans aggregated
        before TEC-953 carry no QR marker, so QR-opened card routes of that time count as NFC.
        Scoping and history clamp as in `/v1/analytics/summary`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subject_type
          in: query
          required: true
          schema: { type: string, enum: [profile, route, card] }
        - name: subject_id
          in: query
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Subject sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAnalyticsSources"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/analytics/events:
    get:
      tags: [Analytics]
      operationId: listAnalyticsRawEvents
      summary: List paginated raw events with filtering
      description: |
        Requires platform.analytics.read. Newest first. The count is bounded (TEC-859): `total`
        counts at most 10,000 matching rows and `total_capped` is true when more match. `has_more`
        (one extra row fetched) tells whether a next page exists, also past the cap.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subject_type
          in: query
          required: false
          schema: { type: string }
        - name: subject_id
          in: query
          required: false
          schema: { type: string }
        - name: event_type
          in: query
          required: false
          schema: { type: string }
        - name: country
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: Paginated raw events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAnalyticsRawEvents"

  /v1/platform/analytics/overview:
    get:
      tags: [Platform Analytics]
      operationId: getPlatformAnalyticsOverview
      summary: Platform-wide event volume KPIs from the aggregate tables
      description: |
        Requires platform.analytics.read (TEC-859). Sums `event_aggregates_hourly` over every
        subject, bucketed into local calendar days of `tz`; never scans raw events. Counts
        follow the worker rollup, so events still in the queue are not included yet. Days of
        zones with a non-whole-hour offset are approximated by hourly buckets. TEC-953 adds
        `unique_visitors` (hourly visitor rollup) and the top 10 `top_event_types` of the
        30-day window.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tz
          in: query
          required: false
          description: IANA time zone of the viewer (e.g. Europe/Istanbul). Default UTC.
          schema: { type: string, example: Europe/Istanbul }
      responses:
        "200":
          description: Platform analytics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePlatformAnalyticsOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/platform/analytics/config:
    get:
      tags: [Platform Analytics]
      operationId: getPlatformAnalyticsConfig
      summary: Get analytics runtime configuration
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Analytics settings
          content:
            application/json:
              schema:
