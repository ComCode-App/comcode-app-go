  /v1/account/invites:
    get:
      tags: [Accounts]
      operationId: listActiveAccountInvites
      summary: Email invites of the active company account
      description: >-
        Owners/admins with `app.account_invites.read` (TEC-945). Without `status` lists open
        invites, pending and expired; `expired` is a pending invite past `expires_at`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: status
          in: query
          schema: { type: string, enum: [pending, expired, accepted, revoked] }
      responses:
        "200":
          description: Invites, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountInvitePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Accounts]
      operationId: createActiveAccountInvite
      summary: Invite an email address to the active company account
      description: >-
        Owners/admins with `app.account_invites.write`. Emails a link valid for 7 days. Owners
        may invite any role, admins every role but owner. An existing member or an open invite
        for the address returns 409 (resend the open invite instead).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [owner, admin, office_manager, member], default: member }
      responses:
        "201":
          description: Invite created and sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountInvite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/account/invites/{uuid}/resend:
    post:
      tags: [Accounts]
      operationId: resendActiveAccountInvite
      summary: Resend an open invite
      description: >-
        Issues a new link (the previous one stops working) valid for another 7 days and emails it.
        Works for expired invites; accepted or revoked ones return 409 `INVITE_CLOSED`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Invite resent
          content:
