  /v1/company/profiles/bulk:
    post:
      tags: [App]
      operationId: postCompanyProfilesBulk
      summary: Run a bulk action on employee profiles of the active company
      description: |
        Requires `app.company_profiles.bulk` and an owner, admin or office manager role in the active
        company (TEC-573). Office managers only change profiles linked to members of their granted
        offices; other targets fail per item. `target.ids` are profile UUIDs; `target.query` takes
        `office_uuid`, `group_uuid` and `q` and selects linked profiles. `params` depend on the action
        (`CompanyBulkContactParams`, `CompanyBulkLogoParams`, `CompanyBulkThemeParams`,
        `CompanyBulkLinksParams`). Every run is a job that can be rolled back within `BULK_ROLLBACK_HOURS`.
        Runs up to `BULK_SYNC_MAX` targets finish inline (200); larger ones are queued (202).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyBulkRequest"
      responses:
        "200":
          description: Applied inline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCompanyBulkSyncResult"
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBulkJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

