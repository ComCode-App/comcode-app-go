        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [Settings]
      operationId: getPlatformSettingsLogo
      summary: "GET /v1/platform/settings/logo"
      description: "Registered in `internal/modules/settings/routes.go`."
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Success envelope (see API_CONVENTIONS.md); some endpoints stream files or redirect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeGeneric" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      tags: [Settings]
      operationId: putPlatformSettingsLogo
      summary: "PUT /v1/platform/settings/logo"
      description: |
        Registered in `internal/modules/settings/routes.go`. Requires `platform.settings.write`.
        Multipart `logo` file up to 2 MiB. The type is sniffed from the bytes: PNG, JPEG, WebP, GIF or a
        static SVG (max 512 KiB). An SVG with script, event handlers, external references, DOCTYPE or
        similar is rejected with 422 `SVG_UNSAFE_CONTENT` (TEC-1097). Stored SVGs are served as
        attachments with `nosniff` and a sandbox CSP.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo: { type: string, format: binary }
      responses:
        "200":
          description: Success envelope (see API_CONVENTIONS.md); some endpoints stream files or redirect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeGeneric" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/SVGUnsafeContent" }

