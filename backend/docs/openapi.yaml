      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 200, description: "The `token` query parameter of the copy email's delete link" }

    ShareProfileExchangeRequest:
      type: object
      required: [path, profile_uuid, consent, consent_version]
      properties:
        path: { type: string, maxLength: 128, description: "The profile page's username" }
        via: { type: string, maxLength: 128 }
        profile_uuid: { type: string, format: uuid, description: "One of the active account's profiles" }
        locale: { type: string, enum: [tr, en] }
        consent: { type: boolean, const: true }
        consent_version: { type: string, description: "From LeadFormConfig.exchange_consent_version" }

