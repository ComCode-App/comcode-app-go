        uuid: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    EnvelopeSubmitLeadResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: "#/components/schemas/SubmitLeadResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    PublicPageSettings:
      type: object
      required: [username, enabled, visible_modules, bank_account_uuids]
      properties:
        username: { type: string }
        enabled: { type: boolean, description: "false = the public page answers 404" }
        visible_modules:
          type: array
          items: { $ref: "#/components/schemas/PublicModule" }
        bank_account_uuids:
          type: array
          items: { type: string, format: uuid }
        background_uuid: { type: [string, "null"], format: uuid, description: "Background Studio design behind the page; null = default" }
        lead_capture_enabled: { type: boolean, description: "Visitors see the lead form (presentation_config.lead_capture.enabled)" }
        contact_exchange_enabled: { type: boolean, description: "Visitors can share their details back (presentation_config.contact_exchange.enabled, TEC-567)" }
        theme:
          description: "The profile's own theme (presentation_config.theme); empty = inherit the account theme, else the default look"
          oneOf:
            - { $ref: "#/components/schemas/PublicTheme" }
            - { type: string, const: "" }
        layout_mode:
          description: "Layout override (presentation_config.layout_mode); empty = the theme's layout"
          oneOf:
            - { $ref: "#/components/schemas/PublicLayoutMode" }
            - { type: string, const: "" }
        inherited_theme:
          description: "Account-level (company) theme used when theme is empty; empty = none"
          oneOf:
            - { $ref: "#/components/schemas/PublicTheme" }
            - { type: string, const: "" }
        inherited_layout_mode:
          description: "Company layout used when layout_mode is empty; empty = none"
          oneOf:
            - { $ref: "#/components/schemas/PublicLayoutMode" }
            - { type: string, const: "" }
        branding_locked: { type: boolean, description: "The company locked its branding (TEC-946): its theme, layout and cover override this profile's own on the public page" }

    PublicTheme:
      type: string
      description: "Public profile theme catalog (TEC-601); tokens live in the frontend (features/public-profile/lib/themes.ts). Premium (design.premium, TEC-947): bold_gradient, elegant_serif, glass"
      enum: [classic_light, dark_minimal, compact_card, bold_gradient, elegant_serif, glass]

    PublicLayoutMode:
      type: string
      enum: [standard, compact, minimal]

    PublicModule:
      type: string
      enum: [bio, contacts, social_links, addresses, bank_accounts]

    UpdatePublicPageRequest:
      type: object
      properties:
        username: { type: string, minLength: 3, maxLength: 40, pattern: "^[a-z0-9](?:[a-z0-9]|[._-][a-z0-9])*$" }
        enabled: { type: boolean }
        visible_modules:
          type: array
          items: { $ref: "#/components/schemas/PublicModule" }
        bank_account_uuids:
          type: array
          items: { type: string, format: uuid }
        background_uuid:
          type: [string, "null"]
          format: uuid
          description: "Omit to keep, null to clear; must be the account's design or a preset"
        lead_capture_enabled: { type: boolean, description: "Show the visitor lead form" }
        contact_exchange_enabled: { type: boolean, description: "Offer contact exchange on the page" }
        theme:
          description: "Omit to keep, empty string to inherit"
          oneOf:
            - { $ref: "#/components/schemas/PublicTheme" }
            - { type: string, const: "" }
        layout_mode:
          description: "Omit to keep, empty string for the theme's layout"
          oneOf:
            - { $ref: "#/components/schemas/PublicLayoutMode" }
            - { type: string, const: "" }

