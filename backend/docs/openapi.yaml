  /v1/orders/{uuid}/checkout:
    post:
      tags: [Commerce Orders]
      operationId: startMyOrderCheckout
      summary: Start an online payment (iyzico / PayTR) for a pending order of the active account
      description: |
        TEC-943. Requires `app.orders.write` and the owner/admin role of the active account. Each call creates a new
        `order_payment_sessions` row (30 minute expiry) through the active payment provider: the
        response carries `iframe_token` (PayTR) or `checkout_url` (iyzico). The provider callback
        (`/v1/public/payment/{provider}/callback`) marks the order paid and starts provisioning; a
        failed or abandoned attempt leaves the order payable. Registered in `internal/modules/billing/routes.go`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: Checkout session started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeOrderCheckoutSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The order is not pending payment (already paid, cancelled or nothing to charge)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No payment provider is configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/orders/checkout/{uuid}:
    get:
      tags: [Commerce Orders]
      operationId: getMyOrderCheckout
      summary: Read an order checkout session of the active account (payment result screen)
      description: |
        TEC-943. A pending session past `expires_at` reads as `expired`. `iframe_token` and
        `checkout_url` are only returned while the session can still be paid. Registered in
        `internal/modules/billing/routes.go`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Order checkout session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeOrderCheckoutSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

