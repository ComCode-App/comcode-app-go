  /v1/company/media:
    get:
      tags: ["App"]
      operationId: "listCompanyMedia"
      summary: "List the company media library"
      description: "TEC-946. Requires app.company_branding.read and an active company account. Files of the active company only, newest first; each file lists where it is used (branding logo/cover, profile avatars/covers). URLs are API-owned."
      security: [{"bearerAuth": []}]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/CompanyMediaKind" } }
      responses:
        "200":
          description: "Library page"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeCompanyMediaPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: ["App"]
      operationId: "uploadCompanyMedia"
      summary: "Upload a file to the company media library"
      description: "TEC-946. Requires app.company_branding.write and an owner/admin role in the active company. The content type is sniffed: cover and image take JPEG, PNG or WebP up to 5 MiB; logo also takes GIF and static SVG (max 512 KiB; unsafe SVG is 422 SVG_UNSAFE_CONTENT, TEC-1097); document takes PDF up to 10 MiB. Bodies above the limit are 413 PAYLOAD_TOO_LARGE. At most 500 files per company (409)."
      security: [{"bearerAuth": []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file: { type: string, format: binary }
                kind: { $ref: "#/components/schemas/CompanyMediaKind" }
                name: { type: string, maxLength: 255, description: "Display name; defaults to the file name" }
      responses:
        "201":
          description: "Uploaded file"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeCompanyMedia" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/SVGUnsafeContent" }
