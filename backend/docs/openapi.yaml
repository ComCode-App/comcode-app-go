    delete:
      tags: [Auth]
      operationId: deleteAuthIdentity
      summary: Unlink an OAuth identity
      description: |
        `409 LAST_SIGN_IN_METHOD` when the user has no password, no passkey and this is
        their last linked identity (TEC-1105).
        Apple: a stored Apple refresh token is revoked at Apple after the identity is
        removed (TEC-1181); a failed revocation is logged and does not fail the unlink.
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [github, google, facebook, apple]
      responses:
        "200":
          description: Unlinked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastSignInMethod"
        "500":
