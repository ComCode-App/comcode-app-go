        params: { type: object, additionalProperties: true, description: "Action parameters of app (account-scoped) jobs" }
        summary: { $ref: "#/components/schemas/BulkSummary" }
        error: { type: [string, "null"] }
        rollback_until: { type: [string, "null"], format: date-time }
        applied_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    EnvelopeBulkJob:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/BulkJob" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeBulkSyncResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          properties:
            sync: { type: boolean }
            summary: { $ref: "#/components/schemas/BulkSummary" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    BulkItemError:
      type: object
      required: [entity_uuid, error]
      properties:
        entity_uuid: { type: string, format: uuid }
        error: { type: string }

    CompanyBulkRequest:
      type: object
      required: [action, target, params]
      properties:
        action: { type: string, enum: [set_contact, set_logo, set_theme, add_links] }
        target: { $ref: "#/components/schemas/BulkTarget" }
        params:
          oneOf:
            - { $ref: "#/components/schemas/CompanyBulkContactParams" }
            - { $ref: "#/components/schemas/CompanyBulkLogoParams" }
            - { $ref: "#/components/schemas/CompanyBulkThemeParams" }
            - { $ref: "#/components/schemas/CompanyBulkLinksParams" }
        locale: { type: string, enum: [tr, en] }

    CompanyBulkAddress:
      type: object
      properties:
        label: { type: string }
        street: { type: string }
        extended: { type: string }
        city: { type: string }
        region: { type: string }
        postal_code: { type: string }
        country: { type: string }

    CompanyBulkContactParams:
      type: object
      description: "set_contact. Omitted fields are unchanged; an empty string clears the work entry. `use_office_address` takes address (and phone, unless given) from the member's office."
      additionalProperties: false
      properties:
        company_name: { type: [string, "null"] }
        address:
          oneOf:
            - { $ref: "#/components/schemas/CompanyBulkAddress" }
            - { type: "null" }
        use_office_address: { type: boolean }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        website: { type: [string, "null"], description: "http(s) URL" }

    CompanyMediaKind:
      type: string
      description: "Library file kind (TEC-946); logo, cover and image are images, document is a PDF"
      enum: [logo, cover, image, document]
    CompanyMediaUsage:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [branding_logo, branding_cover, profile_avatar, profile_cover] }
        profile_uuid: { type: string, format: uuid }
        profile_name: { type: string }
    CompanyMedia:
      type: object
      required: [uuid, kind, name, content_type, size_bytes, url, uploaded_by_uuid, created_at, usage]
      properties:
        uuid: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/CompanyMediaKind" }
        name: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        url: { type: string, description: "API-owned media URL; never build one from a key" }
        uploaded_by_uuid: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        usage:
          type: array
          items: { $ref: "#/components/schemas/CompanyMediaUsage" }
    EnvelopeCompanyMedia:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: "#/components/schemas/CompanyMedia" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    EnvelopeCompanyMediaPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CompanyMedia" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    CompanyMediaRef:
      type: object
      required: [uuid, url]
      properties:
        uuid: { type: string, format: uuid }
        url: { type: string }
    CompanyBranding:
      type: object
      required: [theme, layout_mode, primary_color, logo, cover, locked, updated_at]
      properties:
        theme:
          oneOf:
            - { $ref: "#/components/schemas/PublicTheme" }
            - { type: string, const: "" }
        layout_mode:
          oneOf:
            - { $ref: "#/components/schemas/PublicLayoutMode" }
            - { type: string, const: "" }
        primary_color: { type: string, description: "#rrggbb (lowercase) or empty" }
        logo:
          oneOf:
            - { $ref: "#/components/schemas/CompanyMediaRef" }
            - { type: "null" }
        cover:
          oneOf:
            - { $ref: "#/components/schemas/CompanyMediaRef" }
            - { type: "null" }
        locked: { type: boolean, description: "Employees always render the company look" }
        updated_at: { type: [string, "null"], format: date-time, description: "null = never saved" }
    EnvelopeCompanyBranding:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: "#/components/schemas/CompanyBranding" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    UpdateCompanyBrandingRequest:
      type: object
      additionalProperties: false
      properties:
        theme: { type: string, description: "A PublicTheme or empty" }
        layout_mode: { type: string, description: "A PublicLayoutMode or empty" }
        primary_color: { type: string, description: "#rrggbb or empty" }
        logo_media_uuid: { type: [string, "null"], format: uuid }
        cover_media_uuid: { type: [string, "null"], format: uuid }
        locked: { type: boolean }

    CompanyBulkLogoParams:
      type: object
      description: "set_logo. Points each target's avatar or cover at the company branding logo or cover (a company media library file, TEC-946); nothing is copied. Fails when the branding has no such file."
      additionalProperties: false
      required: [source, target_field]
      properties:
        source: { type: string, enum: [logo, cover] }
        target_field: { type: string, enum: [avatar, cover] }

    CompanyBulkThemeParams:
      type: object
      description: "set_theme. Omitted keeps; empty string clears (inherit / theme layout)."
      additionalProperties: false
      properties:
        theme:
          oneOf:
            - { $ref: "#/components/schemas/PublicTheme" }
            - { type: string, const: "" }
            - { type: "null" }
        layout_mode:
          oneOf:
            - { $ref: "#/components/schemas/PublicLayoutMode" }
            - { type: string, const: "" }
            - { type: "null" }

    CompanyBulkLinksParams:
      type: object
      description: "add_links. Links with a URL the profile already has are skipped."
      additionalProperties: false
      required: [links]
      properties:
        links:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [url]
            properties:
              platform: { type: string, description: "Social platform slug or custom" }
              label: { type: string }
              url: { type: string, format: uri }
        replace_same_platform: { type: boolean }

    EnvelopeCompanyBulkSyncResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [sync, summary, job]
          properties:
            sync: { type: boolean }
            summary: { $ref: "#/components/schemas/BulkSummary" }
            job: { $ref: "#/components/schemas/BulkJob" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    CompanyMemberProfile:
      type: object
      required: [user_uuid, email, name, surname, role, office_uuid, group_uuid, profile]
      properties:
        user_uuid: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        surname: { type: string }
        role: { type: string, enum: [owner, admin, office_manager, member] }
        office_uuid: { type: [string, "null"], format: uuid }
        group_uuid: { type: [string, "null"], format: uuid }
        profile:
          oneOf:
            - type: object
              required: [uuid, first_name, last_name, title, avatar_url]
              properties:
                uuid: { type: string, format: uuid }
                first_name: { type: string }
                last_name: { type: string }
                title: { type: string }
                avatar_url: { type: string }
            - { type: "null" }

    EnvelopeCompanyMemberProfilePage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CompanyMemberProfile" }
            total: { type: integer }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    CompanyMemberProfileLinkInput:
      type: object
      required: [profile_uuid]
      additionalProperties: false
      properties:
        profile_uuid: { type: [string, "null"], format: uuid }

    EnvelopeCompanyMemberProfileLink:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [user_uuid, profile_uuid]
          properties:
            user_uuid: { type: string, format: uuid }
            profile_uuid: { type: [string, "null"], format: uuid }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ImportRowError:
      type: object
      required: [index, error]
      properties:
        index: { type: integer }
        field: { type: string }
        error: { type: string }

    ImportPreviewSummary:
      type: object
      properties:
        total: { type: integer }
        valid: { type: integer }
        invalid: { type: integer }
        rows:
          type: [array, "null"]
          items:
            type: object
            required: [index, data]
            properties:
              index: { type: integer }
              data: { type: object, additionalProperties: true }
              op: { type: string, enum: [create, update] }
        errors:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/ImportRowError" }

    ImportJob:
      type: object
      required: [uuid, resource, format, status, created_at]
      properties:
        uuid: { type: string, format: uuid }
        resource: { type: string }
        format: { type: string }
        status: { type: string, enum: [uploaded, mapped, previewed, queued, applying, applied, failed, rolled_back] }
        mapping: { type: object, additionalProperties: { type: string } }
        defaults: { type: object, additionalProperties: { type: string } }
        preview_summary: { $ref: "#/components/schemas/ImportPreviewSummary" }
        error: { type: [string, "null"] }
        rollback_until: { type: [string, "null"], format: date-time }
        applied_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    ImportMappingRequest:
      type: object
      required: [mapping]
      properties:
        mapping: { type: object, additionalProperties: { type: string }, description: "Source header → field key" }
        defaults: { type: object, additionalProperties: { type: string } }

    EnvelopeImportJob:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ImportJob" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeImportJobPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ImportJob" }
            total: { type: integer }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeBulkJobPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/BulkJob" }
            total: { type: integer }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ReadyzResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          examples: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: string
          properties:
            postgres:
              type: string
              examples: [ok, down]
            redis:
              type: string
              examples: [ok, down]

    IngestEventRequest:
      type: object
      required: [type, subject]
      properties:
        type: { type: string, example: "card.view" }
        schema_version: { type: integer, example: 1 }
        subject:
          type: object
          required: [type, id]
          properties:
            type: { type: string, example: "card" }
            id: { type: string, example: "c79f9024-e910-410a-8d26-7fae879058b8" }
        actor:
          type: object
          properties:
            type: { type: string, example: "user" }
            id: { type: string, example: "usr_123" }
        session_id: { type: string, example: "sess_xyz789" }
        occurred_at: { type: string, format: date-time }
        properties: { type: object, additionalProperties: true }
        metadata: { type: object, additionalProperties: true }

    EnvelopeEventAccepted:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          properties:
            uuid: { type: string, format: uuid }
            type: { type: string }
            status: { type: string, example: "accepted" }
            created_at: { type: string, format: date-time }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    AnalyticsSummary:
      type: object
      required: [total_events, unique_sessions, top_events, today_live_count, today_live_sessions]
      properties:
        total_events: { type: integer }
        unique_sessions: { type: integer }
        top_events:
          type: array
          items:
            type: object
            properties:
              event_type: { type: string }
              count: { type: integer }
        today_live_count: { type: integer }
        today_live_sessions: { type: integer }

    PlatformOverview:
      type: object
      required: [generated_at, window_days, users, profiles, cards, orders, subscriptions, top_profiles, events_last_24h]
      properties:
        generated_at: { type: string, format: date-time }
        window_days: { type: integer, description: Look-back of the "last 30 days" figures }
        users:
          type: object
          required: [total, active_last_30d, new_last_30d]
          properties:
            total: { type: integer, description: Non-deleted users }
            active_last_30d: { type: integer, description: Users who signed in during the window }
            new_last_30d: { type: integer }
        profiles:
          type: object
          required: [total, published]
          properties:
            total: { type: integer }
            published: { type: integer, description: Profiles with an active username page }
        cards:
          type: object
          required: [total, activated, activation_rate]
          properties:
            total: { type: integer }
            activated: { type: integer }
            activation_rate: { type: number, minimum: 0, maximum: 1, description: "activated / total; 0 without cards" }
        orders:
          type: object
          required: [total, funnel]
          properties:
            total: { type: integer, description: Orders created during the window }
            funnel:
              type: array
              description: Every order status in lifecycle order (zero when absent), grouped by current status
              items:
                type: object
                required: [status, count]
                properties:
                  status: { type: string }
                  count: { type: integer }
        subscriptions:
          type: object
          required: [active, trialing, past_due, canceled, canceled_last_30d, mrr, at_risk_mrr]
          properties:
            active: { type: integer }
            trialing: { type: integer }
            past_due: { type: integer }
            canceled: { type: integer }
            canceled_last_30d: { type: integer }
            mrr:
              type: array
              description: |
                Active subscriptions (online payment and manual) on monthly plans plus yearly plans / 12,
                per currency (free and lifetime plans excluded). past_due subscriptions are not counted.
              items: { $ref: "#/components/schemas/PlatformOverviewMRR" }
            at_risk_mrr:
              type: array
              description: The same monthly revenue for past_due subscriptions, per currency (TEC-944). Not part of mrr.
              items: { $ref: "#/components/schemas/PlatformOverviewMRR" }
        top_profiles:
          type: array
          description: Most viewed live profiles (card.view on the profile page), up to 10
          items:
            type: object
            required: [uuid, name, company_name, username, views, unique_sessions]
            properties:
              uuid: { type: string, format: uuid }
              name: { type: string }
              company_name: { type: string }
              username: { type: string }
              views: { type: integer }
              unique_sessions: { type: integer, description: Sum of daily unique sessions }
        events_last_24h:
          type: object
          required: [total, hourly, by_type]
          properties:
            total: { type: integer }
            hourly:
              type: array
              description: 24 hourly buckets, oldest first, current (partial) hour last
              items:
                type: object
                required: [bucket, count]
                properties:
                  bucket: { type: string, format: date-time }
                  count: { type: integer }
            by_type:
              type: array
              description: Up to 8 event types by volume
              items:
                type: object
                required: [event_type, count]
                properties:
                  event_type: { type: string }
                  count: { type: integer }

    PlatformOverviewMRR:
      type: object
      required: [currency, amount_minor, manual_amount_minor, subscriptions]
      properties:
        currency: { type: string }
        amount_minor: { type: integer, description: "Minor units (kuruş)" }
        manual_amount_minor: { type: integer, description: Part of amount_minor from manual (admin-created) subscriptions }
        subscriptions: { type: integer }

    PlatformConversionFunnel:
      type: object
      required: [generated_at, period_days, from, to, cancelled, stages]
      properties:
        generated_at: { type: string, format: date-time }
        period_days: { type: integer, enum: [7, 30, 90, 365] }
        from: { type: string, format: date-time, description: "Counted orders were created in [from, to)" }
        to: { type: string, format: date-time }
        cancelled: { type: integer, description: Orders of the period that are now cancelled or refunded }
        stages:
          type: array
          description: created, paid, in_production, shipped, delivered, in this order
          items:
            type: object
            required: [stage, orders, conversion_from_previous, conversion_from_created, avg_hours_from_created, timed_orders]
            properties:
              stage: { type: string, enum: [created, paid, in_production, shipped, delivered] }
              orders: { type: integer, description: Orders that reached this status or a later one of the lifecycle }
              conversion_from_previous: { type: number, minimum: 0, maximum: 1, description: "orders / previous stage's orders; 0 when it is empty, 1 for created" }
              conversion_from_created: { type: number, minimum: 0, maximum: 1 }
              avg_hours_from_created:
                type: [number, "null"]
                description: Mean hours from order creation to the first recorded entry into the stage; null for created and without recorded entries
              timed_orders: { type: integer, description: Orders the average is based on (backfilled history carries no timing) }

    EnvelopePlatformConversionFunnel:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/PlatformConversionFunnel" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopePlatformOverview:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/PlatformOverview" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeAnalyticsSummary:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/AnalyticsSummary" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    AnalyticsTimeSeriesPoint:
      type: object
      required: [bucket, total_count, unique_sessions]
      properties:
        bucket: { type: string, format: date-time }
        total_count: { type: integer }
        unique_sessions: { type: integer }

    AnalyticsTimeSeriesResult:
      type: object
      required: [interval, points, total]
      properties:
        interval: { type: string, example: "day" }
        points:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsTimeSeriesPoint" }
        total: { type: integer }

    EnvelopeAnalyticsTimeSeries:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/AnalyticsTimeSeriesResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    AnalyticsBreakdownItem:
      type: object
      required: [key, count, percentage]
      properties:
        key: { type: string, example: "TR" }
        count: { type: integer }
        percentage: { type: number, format: float }

    AnalyticsBreakdownResult:
      type: object
      required: [dimension, items, total]
      properties:
        dimension: { type: string, example: "country" }
        items:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsBreakdownItem" }
        total: { type: integer }

    EnvelopeAnalyticsBreakdown:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/AnalyticsBreakdownResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    AnalyticsEntityReference:
      type: object
      required: [type, id]
      properties:
        type: { type: string, example: route }
        id: { type: string, example: "c79f9024-e910-410a-8d26-7fae879058b8" }

    AnalyticsEventContext:
      type: object
      description: Server-side enrichment snapshot. Empty fields are omitted.
      properties:
        ip_hash: { type: string, description: Salted HMAC of the client IP (raw IPs are never stored) }
        country_code: { type: string, example: TR }
        country_name: { type: string }
        city: { type: string }
        timezone: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        device_type: { type: string, example: mobile }
        device_brand: { type: string }
        device_model: { type: string }
        browser: { type: string }
        browser_version: { type: string }
        os: { type: string }
        os_version: { type: string }
        referer: { type: string }
        user_agent: { type: string }

    AnalyticsEventMetadata:
      type: object
      description: Pipeline metadata. Empty fields are omitted.
      properties:
        source: { type: string }
        schema_version: { type: integer }
        delivery_mode: { type: string, example: async }
        batch_id: { type: string }
        ingested_at: { type: string }

    AnalyticsRawEvent:
      type: object
      required: [uuid, type, schema_version, subject, occurred_at, created_at, properties, context, metadata]
      properties:
        id: { type: integer, format: int64 }
        uuid: { type: string, format: uuid }
        type: { type: string, example: card.view }
        schema_version: { type: integer }
        subject: { $ref: "#/components/schemas/AnalyticsEntityReference" }
        actor: { $ref: "#/components/schemas/AnalyticsEntityReference" }
        session_id: { type: string }
        request_id: { type: string }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        properties:
          type: object
          additionalProperties: true
        context: { $ref: "#/components/schemas/AnalyticsEventContext" }
        metadata: { $ref: "#/components/schemas/AnalyticsEventMetadata" }

    AnalyticsRawEventList:
      type: object
      required: [items, total, total_capped, has_more, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsRawEvent" }
        total: { type: integer, description: "Matching events, capped at 10,000" }
        total_capped: { type: boolean, description: "More than 10,000 events match; total is a lower bound" }
        has_more: { type: boolean, description: "Another page exists after this one" }
