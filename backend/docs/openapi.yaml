  /v1/account/entitlements:
    get:
      tags: [Accounts]
      operationId: getActiveAccountEntitlements
      summary: Plan, features and quota usage of the active account
      description: |
        Every catalog feature with the plan value and, for quotas (`cards.max`, `profiles.max`,
        `smart_links.max`), current usage. `included: false` means the plan lacks the feature
        (unavailable); `unlimited` is a value of -1. Any member may read it.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Entitlement overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEntitlementOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/account/members:
    get:
      tags: [Accounts]
      operationId: listActiveAccountMembers
      summary: Members of the active account
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountMemberList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [Accounts]
      operationId: addActiveAccountMember
      summary: Add a user to the active company account (or invite the address)
      description: >-
        Owners may add any role; admins may add admins and members. Personal accounts cannot have
        other members (400); an existing membership returns 409. Only a user whose email is
        verified is added directly (201). For an unverified user or an address without a user an
        email invite is sent instead (202, needs `app.account_invites.write`; an open invite for
        the address is 409), so only the mailbox owner can join (TEC-1104).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [owner, admin, office_manager, member] }
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountMember"
        "202":
          description: The address is not verified (or has no user); an invite was sent instead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountMemberInvited"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/account/members/{user_uuid}:
