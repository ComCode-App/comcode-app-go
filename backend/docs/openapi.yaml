  /v1/orders/assets/upload:
    post:
      tags: [Commerce Orders]
      operationId: uploadOrderAssetPublic
      summary: Upload customer logo/vector artwork using secure token
      description: |
        Unauthenticated; the asset request token is the only gate (TEC-1097). The token is checked
        before the file is read: pass it as `?token=` or as the `token` form field, which must come
        before the `file` part. Invalid token: 404. The file type is sniffed (PNG/JPEG/WebP/GIF, PDF
        or AI, EPS, ZIP, static SVG); max 20 MiB (413). Unsafe SVG: 422 `SVG_UNSAFE_CONTENT`.
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [token, file]
              properties:
                token:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Asset uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAssetRequestSummary"
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/SVGUnsafeContent" }

