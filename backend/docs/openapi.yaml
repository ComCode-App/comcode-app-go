    PlanDetail:
      allOf:
        - $ref: "#/components/schemas/PlanSummary"
        - type: object
          required: [limits]
          properties:
            limits:
              type: array
              items:
                $ref: "#/components/schemas/PlanLimit"

    CreatePlanRequest:
      type: object
      required: [slug, name, billing_interval, limits]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        billing_interval: { type: string }
        price_minor: { type: integer, format: int64 }
        currency: { type: string, enum: [TRY] }
        trial_days: { type: integer, minimum: 0 }
        is_active: { type: boolean }
        sort_order: { type: integer }
        limits:
          type: array
          description: |
            Each limit is validated against its feature's `value_type` (see
            `GET /v1/platform/feature-definitions`); any failure is a 400 `VALIDATION_ERROR`
            with one detail per problem and nothing is written. Every feature definition needs a
            value; a missing one is a `required` detail on `limits.<feature_key>`.
          items:
            $ref: "#/components/schemas/PlanLimitInput"

    PlanLimitInput:
      type: object
      description: |
        One plan limit. Set exactly one value, matching the feature's `value_type`: `int_value`
        for `int` features (`-1` = unlimited, otherwise 0..2147483647), `bool_value` for `bool`
        features. Each `feature_key` must exist and appear exactly once. Detail codes:
        `required`, `unknown_feature`, `duplicate`, `type_mismatch`, `out_of_range`.
      required: [feature_key]
      properties:
        feature_key: { type: string, example: profiles.max }
        int_value: { type: integer, format: int64, minimum: -1, maximum: 2147483647 }
        bool_value: { type: boolean }

    PatchPlanRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        billing_interval: { type: string }
        price_minor: { type: integer, format: int64 }
        currency: { type: string, enum: [TRY] }
        trial_days: { type: integer, minimum: 0 }
        is_active: { type: boolean }
        sort_order: { type: integer }
        limits:
          type: array
          description: |
            Replaces the plan's whole limit set when present (not merged); omit to keep it.
            Each limit is validated against its feature's `value_type` (see
            `GET /v1/platform/feature-definitions`); any failure is a 400 `VALIDATION_ERROR`
            with one detail per problem and nothing is written. Every feature definition needs a
