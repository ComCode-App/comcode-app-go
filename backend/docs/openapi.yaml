        profile_avatar_url: { type: string }
        profile_username: { type: string, description: "Public username of the target profile; target_url points at /{username}" }
        card_uuid: { type: string, format: uuid }
        card_name: { type: string }
        is_locked: { type: boolean }
        is_active: { type: boolean }
        requires_passcode: { type: boolean, description: "Card passcode, or a smart link passcode not yet unlocked (POST /v1/s/{slug}/unlock); target fields are then empty for smart links" }
        lead_capture_enabled: { type: boolean, description: "Card switch or presentation_config.lead_capture.enabled; the profile page shows the lead form" }
        presentation_config: { type: object }
        legacy_metadata: { type: object }

