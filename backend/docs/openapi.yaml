        label: { type: string }
        description: { type: string }
        value_type: { type: string, enum: [int, bool] }
        included: { type: boolean, description: "false = the plan lacks the feature (unavailable)" }
        int_value: { type: integer, format: int32, description: "-1 = unlimited" }
        bool_value: { type: boolean }
        unlimited: { type: boolean }
        used: { type: integer, format: int64, description: "Set for quota features; for monthly features this month's use (locked leads included)" }
        reached: { type: boolean, description: "No more quota-capped resources can be created (monthly: further leads arrive locked, exports are refused)" }
        monthly: { type: boolean, description: "Counted per calendar month in Europe/Istanbul (TEC-941)" }
        resets_at: { type: string, format: date-time, description: "Monthly features: when the counter starts over" }

    EntitlementOverview:
      type: object
      required: [plan_slug, plan_name, status, source, features]
      properties:
        plan_slug: { type: string }
        plan_name: { type: string }
        status: { type: string, enum: [active, free] }
        source: { type: string, enum: [subscription, free] }
        features:
          type: array
          items: { $ref: "#/components/schemas/EntitlementFeature" }

    EnvelopeEntitlementOverview:
