    PublicProfile:
      type: object
      required: [username, profile_uuid, primary_locale, avatar_url, cover_url, visible_modules, translations, contacts, addresses, social_links, bank_accounts]
      properties:
        username: { type: string }
        redirect_to: { type: string, description: "Set when the username was renamed; other fields are empty" }
        profile_uuid: { type: string, format: uuid }
        primary_locale: { type: string, enum: [tr, en] }
        avatar_url: { type: string }
        cover_url: { type: string }
        verified: { type: boolean, description: "Platform-approved verified badge (TEC-549)" }
        visible_modules:
          type: array
          items: { $ref: "#/components/schemas/PublicModule" }
        translations:
          type: array
          items:
            type: object
            required: [locale, first_name, last_name, is_default]
            properties:
              locale: { type: string, enum: [tr, en] }
              prefix: { type: string }
              first_name: { type: string }
              last_name: { type: string }
              middle_name: { type: string }
              suffix: { type: string }
              nickname: { type: string }
              company_name: { type: string }
              department: { type: string }
              title: { type: string }
              role: { type: string }
              bio: { type: string }
              is_default: { type: boolean }
        contacts:
          type: array
          items:
            type: object
            required: [category, value]
            properties:
              category: { type: string, enum: [phone, email, url, whatsapp, other] }
              type: { type: string }
              label: { type: string }
              value: { type: string }
              is_primary: { type: boolean }
        addresses:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              label: { type: string }
              street: { type: string }
              extended: { type: string }
              city: { type: string }
              region: { type: string }
              postal_code: { type: string }
              country: { type: string }
        social_links:
          type: array
          items:
            type: object
            required: [platform, url]
            properties:
              platform: { type: string }
              label: { type: string }
              url: { type: string }
              icon_url: { type: string }
        bank_accounts:
          type: array
          items:
            type: object
            required: [account_holder, iban]
            properties:
              bank_name: { type: string }
              bank_icon_url: { type: string }
              bank_brand_color: { type: string }
              account_holder: { type: string }
              iban: { type: string }
              currency: { type: string }
              title: { type: string }
        background:
          type: object
          additionalProperties: true
          description: >-
            Background Studio document (BackgroundDocument) to render behind the page; omitted = default.
            A premium design is omitted while the owner's plan lacks design.premium (TEC-947).
        background_thumbnail_url:
          type: string
          description: Static stand-in image of `background` for devices that cannot run its shader (TEC-599); omitted when there is none
        theme:
          description: "Resolved theme: the company's when its branding is locked, else the profile's own, else the company default; empty = default look. A premium theme is replaced by its basic counterpart while the owner's plan lacks design.premium (TEC-947)"
          oneOf:
            - { $ref: "#/components/schemas/PublicTheme" }
            - { type: string, const: "" }
        layout_mode:
          description: "Resolved layout override (same precedence as theme); empty = the theme's layout"
          oneOf:
            - { $ref: "#/components/schemas/PublicLayoutMode" }
            - { type: string, const: "" }
        primary_action:
          description: "Main button chosen by the smart link that opened the page (?via=s/{slug}); omitted = save contact"
          allOf: [{ $ref: "#/components/schemas/SmartLinkPrimaryAction" }]
        primary_color: { type: string, description: "Company brand color (#rrggbb, TEC-946); empty = the theme's" }
        company_logo_url: { type: string, description: "Company branding logo; empty = none" }

