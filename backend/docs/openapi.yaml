  /v1/backgrounds:
    get:
      tags: [Backgrounds]
      operationId: listBackgrounds
      summary: Background Studio designs of the active account, then platform presets
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Designs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeBackgroundList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Backgrounds]
      operationId: createBackground
      summary: Save a design in the active account
      description: |
        Owner/admin. The document is validated (kind, shader type whitelist, safe values, 32 KB). Max 100 per account (409).
        A premium (animated) design needs the `design.premium` entitlement: 403 `PLAN_LIMIT_EXCEEDED`
        with `error.details[0].field` = `design.premium` otherwise. A static thumbnail is rendered on save.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertBackgroundRequest" }
      responses:
        "201":
          description: Saved design
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeBackground" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/backgrounds/{uuid}:
    put:
      tags: [Backgrounds]
      operationId: updateBackground
      summary: Replace one of the active account's designs
      description: Same rules as create, including the `design.premium` check (403 `PLAN_LIMIT_EXCEEDED`). The thumbnail is re-rendered.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertBackgroundRequest" }
      responses:
        "200":
          description: Updated design
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeBackground" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Backgrounds]
      operationId: deleteBackground
      summary: Delete one of the active account's designs
      description: Public pages that used it fall back to the default background.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

