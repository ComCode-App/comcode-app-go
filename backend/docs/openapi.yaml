  /v1/platform/orders/{uuid}/refunds:
    get:
      tags: [Commerce Orders]
      operationId: listPlatformOrderRefunds
      summary: List an order's online payments and their provider refunds
      description: |
        TEC-935. `payments` are the completed online payments (`order_payment_sessions`) with what
        was refunded, what is pending and what is still refundable; `paid_order` marks the payment
        that paid the order (other completed payments arrived after it was paid or closed).
        Requires `platform.orders.read`. Registered in `internal/modules/billing/routes.go`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Payments and refunds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeOrderRefunds" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Commerce Orders]
      operationId: refundPlatformOrder
      summary: Refund an online order payment through the payment provider (iyzico / PayTR)
      description: |
        TEC-935. Refunds `amount_minor` (default: everything still refundable) of `payment_uuid`
        (default: the payment that paid the order) through that payment's provider. The refund row
        is stored as pending before the provider is called; the order only changes after the
        provider confirmed: `payment_status` becomes `partially_refunded`, or `refunded` once
        nothing is left, and a fully refunded order moves to `refunded` (unless cancelled) with an
        `order_status_history` row, and its card routes are retired. A repeated request with the same
        `idempotency_key` returns the first refund (`200`) without calling the provider. Writes
        `order.refund_succeeded` / `order.refund_failed` to the activity log. Requires
        `platform.orders.write` and a step-up grant (`403 STEP_UP_REQUIRED` otherwise).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundOrderInput" }
      responses:
        "200":
          description: The refund created earlier with this idempotency key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeOrderRefund" }
        "201":
          description: Refunded at the provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeOrderRefund" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`NOTHING_TO_REFUND` (no online payment or nothing left) or `REFUND_IN_PROGRESS`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: |
            `REFUND_FAILED`: the provider did not refund. The order is unchanged; the refund is
            stored as `failed` with the provider's error and can be retried.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/platform/orders/{uuid}/refunds/{refundUuid}/retry:
    post:
      tags: [Commerce Orders]
      operationId: retryPlatformOrderRefund
      summary: Send a failed refund to the provider again
      description: |
        TEC-935. Retries a `failed` refund with the same provider reference (PayTR `reference_no`).
        A succeeded refund is returned unchanged. Requires `platform.orders.write` and a step-up
        grant. Same `409` / `502` errors as the refund route.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
        - { name: refundUuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Refund after the retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeOrderRefund" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`REFUND_IN_PROGRESS` or `NOTHING_TO_REFUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`REFUND_FAILED`: the provider did not refund"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

