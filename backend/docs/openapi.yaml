        aggregate_retention_days: { type: integer }
        queue_name: { type: string }
        realtime_enabled: { type: boolean }
        batch_size: { type: integer }
        batch_flush_interval_ms: { type: integer }
        ip_hash_salt_rotation_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
          description: |
            IP hash salt rotation period in days (TEC-936). A change applies from the next UTC
            day, so the hashes of one day always share a salt. Out of range returns 400.
        anonymize_ip: { type: boolean }
        ip_hash_salt_rotation_previous_days:
          type: integer
          readOnly: true
          description: Period still in force on `ip_hash_salt_rotation_changed_on` (absent before the first change)
        ip_hash_salt_rotation_changed_on:
          type: string
          format: date
