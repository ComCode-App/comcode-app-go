        via: { type: string, maxLength: 128, description: "c/{code} or s/{slug} the visitor came through" }
        name: { type: string, maxLength: 150 }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 32 }
        company: { type: string, maxLength: 150 }
        job_title: { type: string, maxLength: 150 }
        locale: { type: string, enum: [tr, en] }
        consent: { type: boolean, const: true, description: "KVKK consent; must be true" }
        consent_version: { type: string, description: "From LeadFormConfig.exchange_consent_version" }

