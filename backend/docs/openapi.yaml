      properties:
        path: { type: string }
        target_type: { type: string, enum: [profile, direct_url, vcard_download, social_hub, custom_modules] }
        profile_uuid: { type: string, format: uuid }
        direct_url: { type: string }
        status: { type: string, enum: [reserved, active, locked, retired] }
        presentation_config:
          description: "Smart links: replaces the whole SmartLinkPresentationConfig (omit to keep it); validated as on create"
          allOf: [{ $ref: "#/components/schemas/SmartLinkPresentationConfig" }]

    SmartLinkPrimaryAction:
      type: string
      enum: [save_contact, call, email, whatsapp, website]

    SmartLinkPresentationConfig:
      type: object
      additionalProperties: false
      description: |
        How a smart link presents its target profile (TEC-556). Unknown keys are rejected.
        Responses replace the stored passcode hash with `security.passcode_enabled: true`;
        visitor resolutions omit `security`.
      properties:
        theme:
          description: "Premium themes need design.premium when picked (a link keeps the one it has after a downgrade; the page then renders the basic one). Locked company branding still wins"
          allOf: [{ $ref: "#/components/schemas/PublicTheme" }]
        layout_mode: { $ref: "#/components/schemas/PublicLayoutMode" }
        visible_modules:
          type: array
          description: "Modules shown when the page is opened through the link; only narrows the profile's own selection. Omitted = the profile's selection"
          items: { $ref: "#/components/schemas/PublicModule" }
        primary_action:
          type: object
          required: [type]
          properties:
            type: { $ref: "#/components/schemas/SmartLinkPrimaryAction" }
        lead_capture:
          type: object
          description: "Lead form on the profile page opened through the link; only profile targets show it"
          required: [enabled]
          properties:
            enabled: { type: boolean }
        security:
          type: object
          properties:
            passcode_enabled:
              type: boolean
              description: "false removes the passcode; true without passcode keeps the current one"
            passcode:
              type: string
              minLength: 4
              maxLength: 64
              writeOnly: true
              description: "New passcode; stored hashed, never returned"

    RouteResolution:
      type: object
      required: [route_uuid, path, route_type, status, target_type, is_locked, is_active, requires_passcode, presentation_config]
      properties:
        route_uuid: { type: string, format: uuid }
        path: { type: string }
        route_type: { type: string }
        status: { type: string }
        target_type: { type: string }
        target_url: { type: string }
