      summary: Upload an employee import file
      description: |
        Requires `app.company_profiles.import` and an owner/admin role in the active company (TEC-573).
        Columns: name, surname, email (required), title, office, group, phone. Each row names a
        registered user by email; the user is added as a member if needed, placed in the office/group
        (matched by name) and gets a created or updated linked employee profile. Continue with
        mapping, preview (dry run with row errors), confirm and rollback under `/v1/company/imports/{uuid}`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                format: { type: string, enum: [csv, tsv, xlsx, json] }
                locale: { type: string, enum: [tr, en] }
      responses:
        "201":
          description: Import job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeImportJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
