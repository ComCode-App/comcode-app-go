      summary: "Company analytics top-N dimension breakdown"
      description: "Same access, scope and clamp as the summary. Top values of a visitor dimension summed over the scope; `total` is the sum over every value, not only the returned ones."
      security: [{"bearerAuth": []}]
      parameters: [{"$ref": "#/components/parameters/CompanyAnalyticsFrom"}, {"$ref": "#/components/parameters/CompanyAnalyticsTo"}, {"name": "office_uuid", "in": "query", "schema": {"type": "string", "format": "uuid"}}, {"name": "group_uuid", "in": "query", "schema": {"type": "string", "format": "uuid"}}, {"name": "dimension", "in": "query", "schema": {"type": "string", "default": "country", "enum": ["country", "city", "device", "browser", "os", "referer"]}}, {"name": "event_type", "in": "query", "description": "Only this event type", "schema": {"type": "string"}}, {"name": "limit", "in": "query", "description": "Top N", "schema": {"type": "integer", "minimum": 1, "maximum": 50, "default": 10}}]
