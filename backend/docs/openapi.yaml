  /v1/routes/{uuid}:
    get:
      tags: [Global Routes]
      operationId: getRoute
      summary: Get route details by UUID
      description: Non-admin callers only see routes they own; other routes return 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Route detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRouteDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Global Routes]
      operationId: updateRoute
      summary: Update route target or presentation configuration
      description: >-
        Owners may change target and presentation. `status` is admin-only (lifecycle is driven by
        activation, lock toggle and retirement), and only `custom_smart_link` routes may change `path`.
        Picking a premium smart link theme needs `design.premium` (403 `PLAN_LIMIT_EXCEEDED`).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRouteInput"
      responses:
        "200":
          description: Route updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRouteDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrPlanLimit"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Global Routes]
      operationId: deleteRoute
      summary: Soft delete / retire route
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Route deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSimpleSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/routes/{uuid}/toggle-lock:
    patch:
      tags: [Global Routes]
      operationId: toggleRouteLock
      summary: Toggle route lock status
      description: Switches between `active` and `locked`. Reserved or retired routes return 409.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Route lock toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRouteDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/r/{path}:
    get:
      tags: [Global Routes]
      operationId: resolveRoute
      summary: Universal route resolver (supports canonical profile, legacy hash, smart links)
      parameters:
        - name: src
          in: query
          description: Explicit QR marker. qr records card.qr.scan (card subject when present, otherwise route); analytics failure never changes resolution or access checks. Omit for NFC and ordinary visits.
          schema: { type: string, enum: [qr] }
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Route target and presentation resolution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRouteResolution"

  /v1/s/{slug}:
    get:
      tags: [Global Routes]
      operationId: resolveCustomSmartLink
      summary: Resolve custom smart link
      parameters:
        - name: src
          in: query
          description: Explicit QR marker. qr records card.qr.scan (card subject when present, otherwise route); analytics failure never changes resolution or access checks. Omit for NFC and ordinary visits.
          schema: { type: string, enum: [qr] }
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Smart link target and presentation resolution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRouteResolution"

  /v1/s/{slug}/unlock:
    post:
      tags: [Global Routes]
      operationId: unlockCustomSmartLink
      summary: Unlock a passcode-protected smart link
      description: |
        No auth. `GET /v1/s/{slug}` answers `requires_passcode: true` without a target for a
        passcode-protected link; the visitor's passcode goes in the body here (never in the URL).
        A correct passcode returns the resolution with `target_url` (`Cache-Control: no-store`).
        Wrong passcodes are rate limited per visitor and link, per visitor, and per link
        (15 minute window); only wrong attempts count.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passcode]
              properties:
                passcode: { type: string, minLength: 1 }
      responses:
        "200":
          description: Unlocked resolution with target_url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRouteResolution"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Wrong passcode (`INVALID_PASSCODE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

