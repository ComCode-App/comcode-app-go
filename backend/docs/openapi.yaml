  /v1/billing/payments:
    get:
      tags: [Billing]
      operationId: listBillingPayments
      summary: Payment history of the active account
      description: Every successful charge of the active account, newest first (TEC-590); any member of the account. Kinds are `subscription_checkout`, `subscription_renewal`, `subscription_upgrade`, `order` (online card order payment) and `order_manual` (bank transfer recorded by the platform). Receipts are rendered on demand; nothing is stored.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of payments
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  meta: { type: object, additionalProperties: true }
                  data:
                    type: object
                    required: [items, total, limit, offset]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BillingPayment" }
                      total: { type: integer, format: int64 }
                      limit: { type: integer }
                      offset: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/billing/payments/{uuid}/receipt:
    get:
      tags: [Billing]
      operationId: downloadBillingPaymentReceipt
      summary: PDF receipt of one payment
      description: Streams a letterheaded PDF receipt (`RCP-…`) of a payment of the active account (TEC-590). The document states that it is a receipt, not an invoice. `locale` (tr/en) selects the language; the `Accept-Language` header is the fallback.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: locale, in: query, required: false, schema: { type: string, enum: [tr, en] } }
      responses:
        "200":
          description: "PDF document (Content-Disposition: attachment)"
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
