        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/invites/{token}:
    get:
      tags: [Accounts]
      operationId: previewInvite
      summary: Describe an invite link
      description: >-
        Public; the token is the credential. `user_exists` tells the page whether to offer login or
        sign-up. Rate-limited per client IP (429); responses carry `Referrer-Policy: no-referrer`.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeInvitePreview"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/invites/{token}/accept:
    post:
      tags: [Accounts]
      operationId: acceptInvite
      summary: Accept an invite as the signed-in user
      description: >-
        The user's email must be the invited address (403 `INVITE_EMAIL_MISMATCH`). The user joins
        the account with the invited role (an existing member keeps theirs). A profile the employee
        import created for the invite becomes the member's employee profile and the member is placed
        in its office/group. Expired: 410 `INVITE_EXPIRED`; accepted or revoked: 409 `INVITE_CLOSED`;
        suspended account: 403; while impersonating: 403 `INVITE_IMPERSONATION`. Rate-limited per
        user and client IP (429); responses carry `Referrer-Policy: no-referrer`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeInviteAccept"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: Invite expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

