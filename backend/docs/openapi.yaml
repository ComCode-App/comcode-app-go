        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Global Routes]
      operationId: putRouteQR
      summary: Replace route QR appearance
      description: >-
        Requires app.routes.write and an owner/admin active account role. Route identity and target
        remain unchanged. Logo media must be a current PNG/JPEG avatar or cover of a profile in the
        same account (max 2 MiB and 2048 pixels per edge). Missing or inaccessible logos are rejected.
