        profile_views: {"type": "integer", "format": "int64", "description": "card.view on profiles"}
        card_taps: {"type": "integer", "format": "int64", "description": "route.scan on card and legacy card routes"}
        qr_scans: {"type": "integer", "format": "int64", "description": "card.qr.scan (branded QR, ?src=qr)"}
        contact_saves: {"type": "integer", "format": "int64", "description": "vcard.download"}
        link_clicks: {"type": "integer", "format": "int64", "description": "route.scan on smart links"}
        contact_clicks: {"type": "integer", "format": "int64", "description": "contact.*, social.* and bank.* interactions"}
        leads: {"type": "integer", "format": "int64", "description": "Lead form submissions"}
      required: ["total_events", "profile_views", "card_taps", "qr_scans", "contact_saves", "link_clicks", "contact_clicks", "leads"]
