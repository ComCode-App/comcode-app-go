        profiles: {"type": "integer", "format": "int64", "description": "Live profiles in scope"}
        active_profiles: {"type": "integer", "format": "int64", "description": "Profiles in scope with at least one event or lead"}
      required: ["from", "to", "history_days", "totals", "top_events", "profiles", "active_profiles"]
