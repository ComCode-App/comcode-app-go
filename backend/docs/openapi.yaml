  /v1/public/payment/paytr/callback:
    post:
      tags: [Public]
      operationId: postPublicPaymentPaytrCallback
      summary: PayTR payment notification
      description: |
        Public server-to-server notification. Verifies the PayTR HMAC before any mutation.
        Completed or failed checkouts are acknowledged without repeating effects.
        Successful checkouts validate the stored order amount and currency (TL aliases TRY);
        total_amount may exceed the order amount for installment fees but cannot be lower.
        Failure reasons are stored in checkout metadata. No session or CSRF token is required.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [merchant_oid, status, total_amount, hash]
              properties:
                merchant_oid: { type: string }
                status: { type: string, enum: [success, failed] }
                total_amount: { type: string, pattern: '^[0-9]+$', description: Collected amount in minor units; signed by the HMAC. }
                hash: { type: string, description: Base64 HMAC-SHA256 of merchant_oid + merchant_salt + status + total_amount using merchant_key. }
                payment_amount: { type: string, description: Original order amount in minor units; required for success. }
                currency: { type: string, description: Currency; required for success. TL and TRY are equivalent. }
                failed_reason_code: { type: string }
                failed_reason_msg: { type: string }
                test_mode: { type: string, enum: ['0', '1'] }
      responses:
        "200":
          description: Notification accepted, including already processed duplicates.
          content:
            text/plain:
              schema: { type: string, const: OK }
        "400":
          description: Invalid hash, fields, payment mismatch, unknown session or processing failure; no acknowledgement.
          content:
            text/plain:
              schema: { type: string, const: FAIL }

