openapi: 3.1.0
info:
  title: App API
  version: 0.1.0
  summary: Boilerplate HTTP API — auth, RBAC, users, roles, notifications, realtime
  description: |
    Starter HTTP API for the Next.js + Go boilerplate.

    **In scope:** authentication, global RBAC, platform users/roles, notifications,
    Web Push (VAPID), passkeys, and Centrifugo realtime tokens.

    **Out of scope:** tenants, workspaces, CRM, inbox, commerce, AI, tickets, reports.
    Those product modules were stripped. Live Go routes (`internal/modules/**/routes.go`)
    are the source of truth if a path below is missing from the router.

    **Roles:**
    - `super_admin` — system role; assigned via `make create-super-admin`
    - `subscriber` — system role for app shell access
    - Custom roles via `/v1/platform/roles`

    **Auth:** Bearer JWT access tokens + opaque refresh tokens.
    See `docs/auth.md` for the permission matrix and token claims.
    Error catalog: `docs/api/errors.md`.

    **Conventions:**
    - Success/error envelope: `{success,data|error,meta.request_id}` on all `/v1/*`.
    - Lists: `{items,total,limit,offset}` under `data` (`limit`/`offset`/`q`/`sort`; never `page`/`search`).
    - Probes `/healthz` and `/readyz` are **not** enveloped.
    - Mobile app: reaches `/v1/*` through the Next.js mobile gateway (`/api/mobile/v1/*`, Bearer
      only) and sends `X-Client: comcode-mobile`, `X-App-Version`, `X-Platform: ios|android`.
      An app below `mobile.min_version` gets `426 APP_UPDATE_REQUIRED` (see `AppUpdateRequired`).
    - See `API_CONVENTIONS.md` and `docs/api/errors.md`.
  contact:
    name: App
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: http://127.0.0.1:58080
    description: Local development

tags:
  - name: Leads
    description: Lead capture forms on public profiles, cards and smart links, and the account's lead inbox
  - name: Webhooks
    description: "Outbound webhooks of the active account (TEC-603): HTTPS endpoints subscribed to lead, scan and order events, HMAC-signed deliveries with retries, delivery log and resend"
  - name: Health
    description: Liveness and readiness probes
  - name: Error Tracking
    description: Panel-managed Sentry-compatible DSNs ("Hata izleme") and the browser SDK config
  - name: Auth
    description: Register, login, tokens, sessions, profile
  - name: Search
    description: Command-palette search (Meilisearch-backed record lookup)
  - name: Backgrounds
    description: Background Studio designs (account) and gallery presets (platform)
  - name: Platform
    description: Super-admin platform tenant/user catalog
  - name: Realtime
    description: Centrifugo connection and subscription tokens
  - name: Notifications
    description: In-app notification center, preferences, and admin send
  - name: Billing
    description: Subscriber billing, saved cards, and checkout
  - name: Events
    description: Generic polymorphic event ingestion and telemetry
  - name: Analytics
    description: Aggregated metrics, time series, and breakdown analytics
  - name: Platform Overview
    description: Platform-wide business KPIs for the /platform home
  - name: Profile Verifications
    description: Verified profile badge requests (owner side) and the platform review queue (TEC-549)
  - name: Platform Analytics
    description: Administrative analytics settings and retention rules
  - name: Platform GeoIP
    description: Administrative GeoIP database status, update, and settings
  - name: Platform Events
    description: Administrative event definitions and registry schemas
  - name: Platform Support
    description: Card and route support screens for platform staff (TEC-950)
  - name: App
    description: Authenticated app shell routes

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealthz
      summary: Liveness probe
      description: Process is alive. Does not check dependencies.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzResponse"

  /readyz:
    get:
      tags: [Health]
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Pings Postgres and Redis. Returns 200 when both are up, 503 otherwise.
        Object storage is a soft check (logged only).
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyzResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyzResponse"

  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: postAuthRegister
      summary: Self-serve user register
      description: |
        Creates a global user account and returns it. Tokens are issued on login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRegister"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: postAuthLogin
      summary: Login
      description: |
        Authenticates with email/password and returns a token pair. An unknown email and a wrong
        password get the same `401 INVALID_CREDENTIALS`; a disabled account is reported (403) only
        after the correct password. Rate limited per IP + email, per IP and per email.

        The mobile app sends `X-Client: mobile` (plus `X-Device-Name`, `X-App-Version`): the new
        session gets the mobile refresh lifetime (`JWT_REFRESH_TTL_MOBILE`, default 60 days)
        instead of `JWT_REFRESH_TTL` (7 days).
      security: []
      parameters:
        - $ref: "#/components/parameters/XClient"
        - $ref: "#/components/parameters/XDeviceName"
        - $ref: "#/components/parameters/XAppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "426":
          $ref: "#/components/responses/AppUpdateRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: postAuthRefresh
      summary: Refresh tokens
      description: |
        Rotates an opaque refresh token and returns a new token pair. The new refresh token's
        lifetime restarts (sliding) and follows the session's client type, fixed at sign-in:
        `JWT_REFRESH_TTL` for web, `JWT_REFRESH_TTL_MOBILE` for the mobile app. `X-Client` on
        this call cannot change it; `X-App-Version` updates the session's app version.

        Reuse detection: presenting a refresh token that was already rotated
        - less than 30 seconds after its rotation answers `409 REFRESH_RACE` (a concurrent
          refresh; the session stays live, use the token the other request received);
        - later revokes the whole session (every token of the family) and emails the owner a
          security notice (`auth.refresh_reuse`); the answer is `401`.
        A token revoked by logout or session revocation simply answers `401`.
      security: []
      parameters:
        - $ref: "#/components/parameters/XClient"
        - $ref: "#/components/parameters/XDeviceName"
        - $ref: "#/components/parameters/XAppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/RefreshRace"
        "426":
          $ref: "#/components/responses/AppUpdateRequired"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: postAuthLogout
      summary: Logout
      description: Revokes the given refresh token. Requires a valid access JWT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/me:
    get:
      tags: [Auth]
      operationId: getAuthMe
      summary: Current session
      description: Hydrates the authenticated user, roles, permissions, and tenant memberships.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMe"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "426":
          $ref: "#/components/responses/AppUpdateRequired"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/search/specs:
    get:
      tags: [Search]
      operationId: getSearchSpecs
      summary: Searchable resource specs
      description: Returns Meilisearch-backed specs visible to the caller (permission-filtered).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Spec catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSearchSpecs"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/search:
    get:
      tags: [Search]
      operationId: getSearch
      summary: Search indexed records
      description: Typo-tolerant search across allowed specs. Use `q` (not `search`). Optional `spec` scopes to one resource.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: spec
          in: query
          schema:
            type: string
            example: users
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Search hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSearchHits"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up:
    get:
      tags: [Auth]
      operationId: getAuthStepUp
      summary: Step-up grant status
      description: Returns whether the caller has a recent step-up grant and enabled verification methods.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Step-up status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up/password:
    post:
      tags: [Auth]
      operationId: postAuthStepUpPassword
      summary: Verify password for step-up
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpPasswordRequest"
      responses:
        "200":
          description: Grant issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpGrant"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up/passkey/options:
    post:
      tags: [Auth]
      operationId: postAuthStepUpPasskeyOptions
      summary: Begin passkey step-up assertion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: WebAuthn request options
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up/passkey/verify:
    post:
      tags: [Auth]
      operationId: postAuthStepUpPasskeyVerify
      summary: Finish passkey step-up assertion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Grant issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpGrant"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up/totp:
    post:
      tags: [Auth]
      operationId: postAuthStepUpTOTP
      summary: Verify authenticator code for step-up
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Grant issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpGrant"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp:
    get:
      tags: [Auth]
      operationId: getAuthTOTP
      summary: Authenticator 2FA status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: TOTP status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTOTPStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp/setup:
    post:
      tags: [Auth]
      operationId: postAuthTOTPSetup
      summary: Begin authenticator 2FA setup
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Setup secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTOTPSetup"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp/confirm:
    post:
      tags: [Auth]
      operationId: postAuthTOTPConfirm
      summary: Confirm authenticator 2FA setup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Confirmed with recovery codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTOTPConfirm"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp/disable:
    post:
      tags: [Auth]
      operationId: postAuthTOTPDisable
      summary: Disable authenticator 2FA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/access/settings:
    get:
      tags: [Platform]
      operationId: getPlatformAccessSettings
      summary: Read step-up policy
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Access policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpPolicy"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Platform]
      operationId: patchPlatformAccessSettings
      summary: Update step-up policy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStepUpPolicyRequest"
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/integrations/github:
    get:
      tags: [Platform]
      operationId: getPlatformGitHubIntegrationSettings
      summary: Read GitHub App integration settings
      description: Super admin only. Secrets are never returned; only configured flags.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: GitHub integration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGitHubIntegrationSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Platform]
      operationId: patchPlatformGitHubIntegrationSettings
      summary: Update GitHub App integration settings
      description: Super admin only. Omit blank secret fields to keep existing values.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchGitHubIntegrationSettingsRequest"
      responses:
        "200":
          description: Updated GitHub integration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGitHubIntegrationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/system/info:
    get:
      tags: [Platform]
      operationId: getPlatformSystemInfo
      summary: Read system runtime metrics, infrastructure health, and environment diagnostics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: System runtime info and health diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSystemInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/system/ping:
    post:
      tags: [Platform]
      operationId: pingPlatformSystem
      summary: Trigger a live health and latency probe across all backing services
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Live probe results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSystemInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/auth/settings:
    get:
      tags: [Platform]
      operationId: getPlatformAuthSettings
      summary: Read registration and auth method settings
      description: Super admin only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Auth settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAuthSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Platform]
      operationId: patchPlatformAuthSettings
      summary: Update registration and auth method settings
      description: Super admin only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAuthSettingsRequest"
      responses:
        "200":
          description: Updated auth settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAuthSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/error-tracking:
    get:
      tags: [Error Tracking]
      operationId: getPlatformErrorTracking
      summary: Get the error tracking setting
      description: |
        Super admin with `platform.error_tracking.read`. DSNs are stored encrypted and never returned,
        only `*_dsn_hint` (scheme, host and project, key masked). `backend_source` says which DSN the
        API and worker use: `panel`, `env` (`SENTRY_DSN` fallback while the panel has no backend DSN)
        or `off`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Error tracking setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeErrorTrackingSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Error Tracking]
      operationId: patchPlatformErrorTracking
      summary: Update the error tracking setting
      description: |
        Super admin with `platform.error_tracking.write`. An omitted DSN keeps the stored value, an empty
        string clears it. The API and worker processes apply the change without a restart (Redis
        invalidation, with a one-minute periodic reload as a safety net).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchErrorTrackingSettingsRequest" }
      responses:
        "200":
          description: Updated setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeErrorTrackingSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/platform/error-tracking/test:
    post:
      tags: [Error Tracking]
      operationId: sendPlatformErrorTrackingTest
      summary: Send a test error through the backend DSN
      description: Super admin with `platform.error_tracking.write`. 409 when backend reporting is off.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Event sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeErrorTrackingTestResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/public/error-tracking:
    get:
      tags: [Error Tracking]
      operationId: getPublicErrorTrackingConfig
      summary: Browser error tracking SDK config
      description: |
        No auth. Read at runtime by the panel SDK and by the lazy catcher on visitor pages, so the
        frontend DSN is never baked into the build. Served from memory; `Cache-Control: public, max-age=60`.
      security: []
      responses:
        "200":
          description: SDK config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeErrorTrackingPublicConfig" }

  /v1/platform/integrations/google:
    get:
      tags: [Platform]
      operationId: getPlatformGoogleIntegrationSettings
