          type: array
          items: { type: string }
        filterable_fields:
          type: array
          items: { type: string }
        columns:
          type: array
          items: { type: object, additionalProperties: true }
        filters:
          type: array
          items: { type: object, additionalProperties: true }
        includes:
          type: array
          items: { type: string }
        bulk_actions:
          type: array
          items: { type: string }

    PatchProfileRequest:
      type: object
      properties:
        name: { type: string }
        surname: { type: string }
        locale:
          type: string
          enum: [tr, en]

    EmailCodeRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    EmailCodeVerifyRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, description: 6-digit code from the email }
        totp_code:
          type: string
          description: Authenticator or recovery code, required after `MFA_REQUIRED`.

    NativeOAuthTokenRequest:
      type: object
      required: [id_token, nonce]
      properties:
        id_token:
          type: string
          description: The id_token returned by the Apple / Google SDK in the app.
        nonce:
          type: string
          description: >-
            The raw nonce the app generated for this sign-in. The token's `nonce` claim must equal
            it or its hex SHA-256.
        authorization_code:
          type: string
          description: Apple only, optional. Exchanged at Apple for a refresh token that is stored encrypted and revoked when the Apple identity is unlinked or the account is deleted. Best effort; a failed exchange never fails the request. Ignored for Google.

    NativeOAuthSignInRequest:
      allOf:
        - $ref: "#/components/schemas/NativeOAuthTokenRequest"
        - type: object
          properties:
            given_name:
              type: string
              description: >-
                Apple sends the name to the app on the first authorization only (never in the
                id_token); used as the new account's name when the token has none.
            family_name: { type: string }
            totp_code:
              type: string
              description: Authenticator or recovery code, required after `MFA_REQUIRED`.

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [email, code, password]
      properties:
        email: { type: string, format: email }
        code: { type: string }
        password: { type: string, format: password }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password }

    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
