  /v1/platform/settings:
    get:
      tags: [Settings]
      operationId: getPlatformSettings
      summary: "GET /v1/platform/settings"
      description: "Registered in `internal/modules/settings/routes.go`. Requires `platform.settings.read`."
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Success envelope (see API_CONVENTIONS.md); some endpoints stream files or redirect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeGeneric" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Settings]
      operationId: patchPlatformSettings
      summary: "PATCH /v1/platform/settings"
      description: |
        Registered in `internal/modules/settings/routes.go`. Requires `platform.settings.write`.
        Partial update of the branding / letterhead fields and the mobile app version gate
        (`mobile_*`, published in `GET /v1/app/config` as `mobile`). Versions are `""` or
        `major[.minor[.patch]]` and `mobile_latest_version` may not be lower than
        `mobile_min_version`; store URLs are `""` or an `https` URL. Invalid values answer
        `400 VALIDATION_ERROR` with field details.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                mobile_min_version: { type: string, examples: ["1.2.0"] }
                mobile_latest_version: { type: string, examples: ["1.4.1"] }
                mobile_ios_store_url: { type: string, examples: ["https://apps.apple.com/app/id0000000000"] }
                mobile_android_store_url: { type: string, examples: ["https://play.google.com/store/apps/details?id=software.technowide.comcode"] }
      responses:
        "200":
          description: Success envelope (see API_CONVENTIONS.md); some endpoints stream files or redirect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeGeneric" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/platform/settings/logo:
    delete:
      tags: [Settings]
      operationId: deletePlatformSettingsLogo
      summary: "DELETE /v1/platform/settings/logo"
      description: "Registered in `internal/modules/settings/routes.go`. Requires `platform.settings.write`."
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Success envelope (see API_CONVENTIONS.md); some endpoints stream files or redirect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeGeneric" }
