  /v1/platform/cards:
    get:
      tags: [Platform Support]
      operationId: searchPlatformCards
      summary: Search cards by serial, smart code or card UID
      description: |
        Prefix match on `smart_code`, `card_uid` (system serial) and a migrated card's legacy
        serial, across every account (TEC-950). Returns at most 25 cards. Requires `platform.cards.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          description: At least 2 characters
          schema: { type: string, minLength: 2 }
      responses:
        "200":
          description: Matching cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSupportCardList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/platform/cards/{uuid}:
    get:
      tags: [Platform Support]
      operationId: getPlatformCard
      summary: Card support detail (owner, account, order, activation, route)
      description: Requires `platform.cards.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSupportCard" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/platform/cards/{uuid}/retire:
    post:
      tags: [Platform Support]
      operationId: retirePlatformCard
      summary: Retire a card
      description: |
        The card route becomes `retired` ("card deactivated"), its path is never handed out again
        and an unused activation code is cleared. One-way. Drops the card's resolver cache entries
        and writes `card.retired` to the activity log. Requires `platform.cards.write` and a step-up
        grant (`403 STEP_UP_REQUIRED` otherwise). `409 CARD_RETIRED` / `CARD_HAS_NO_ROUTE`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Retired card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSupportCard" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/platform/cards/{uuid}/reassign:
    post:
      tags: [Platform Support]
      operationId: reassignPlatformCard
      summary: Reassign an activated card to another profile
      description: |
        The card and its card route move to the profile, the profile's account and its owner (the
        profile's user, or the account owner). Smart code, UID and path do not change. Drops the
        card's resolver cache entries and writes `card.reassigned` to the activity log. Requires
        `platform.cards.write` and a step-up grant (`403 STEP_UP_REQUIRED` otherwise).
        `409 CARD_RETIRED` / `CARD_NOT_ACTIVATED`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReassignSupportCardInput" }
      responses:
        "200":
          description: Reassigned card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSupportCard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/platform/routes:
    get:
      tags: [Platform Support]
      operationId: searchPlatformRoutes
      summary: Search routes by path
      description: |
        Substring match on the path, deleted smart links included, plus routes whose renamed-away
        old path matches (`route_history`). Returns at most 25 routes. Requires `platform.routes.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          description: At least 2 characters; outer slashes are ignored
          schema: { type: string, minLength: 2 }
      responses:
        "200":
          description: Matching routes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSupportRouteList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/platform/routes/quarantine/release:
    post:
      tags: [Platform Support]
      operationId: releasePlatformRouteQuarantine
      summary: Release a quarantined path early
      description: |
        Ends the 30-day hold of deleted smart links and smart link renames on the path, so a new
        smart link can take it now. Drops the path's resolver cache entry and writes
        `route.quarantine_released` to the activity log. Requires `platform.routes.write` and a
        step-up grant (`403 STEP_UP_REQUIRED` otherwise). `409 PATH_NOT_QUARANTINED`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseQuarantineInput" }
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeQuarantineRelease" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/platform/routes/{uuid}:
    get:
      tags: [Platform Support]
      operationId: getPlatformRoute
      summary: Route support detail (target, status, history, owner)
      description: Deleted routes are included. Requires `platform.routes.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSupportRoute" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    adapterKey:
      type: apiKey
      in: header
      name: X-Auth-Adapter-Key
      description: Shared secret of the NextAuth adapter (BFF only)
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CompanyAnalyticsFrom:
      name: from
      in: query
      description: "First UTC day (YYYY-MM-DD, inclusive). Default: 29 days before `to`. A range spans at most 366 days."
      schema: {"type": "string", "format": "date"}
    CompanyAnalyticsTo:
      name: to
      in: query
      description: "Last UTC day (YYYY-MM-DD, inclusive). Default: today."
      schema: {"type": "string", "format": "date"}
    ResourceUUID:
      name: uuid
      in: path
      required: true
      description: Resource UUID
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Q:
      name: q
      in: query
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: Comma-separated fields; prefix `-` for descending
      schema: { type: string }
    XClient:
      name: X-Client
      in: header
      required: false
      description: |
        `mobile` (or `comcode-mobile`) for the mobile app; anything else is a web session. Fixes
        the refresh lifetime of a new session (TEC-1179). The web BFF never forwards it.
      schema: { type: string, enum: [mobile, comcode-mobile] }
    XDeviceName:
      name: X-Device-Name
      in: header
      required: false
      description: Mobile app only. Device label shown in the sessions list (printable, max 100 characters).
      schema: { type: string, maxLength: 100 }
    XAppVersion:
      name: X-App-Version
      in: header
      required: false
      description: Mobile app only. App version shown in the sessions list (max 32 characters).
      schema: { type: string, maxLength: 32 }

  responses:
    AppUpdateRequired:
      description: |
        The mobile app (`X-Client: comcode-mobile`) sent an `X-App-Version` below the configured
        `mobile.min_version` (`GET /v1/app/config`). Code `APP_UPDATE_REQUIRED`; `error.details[0]`
        is `{field: "min_version", message: "<min version>"}`. Applies to every `/v1` route except
        `GET /v1/app/config`; web requests never carry `X-Client` and are not affected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Validation or malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Missing or invalid credentials / access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForbiddenOrPlanLimit:
      description: |
        `FORBIDDEN` when the account role cannot write, or `PLAN_LIMIT_EXCEEDED` when the active
        account's plan quota is used up. For quotas, `error.details[0].field` is the feature key
        (`profiles.max`, `smart_links.max`, `cards.max`); see `GET /v1/account/entitlements`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict (duplicate / constraint)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RefreshRace:
      description: |
        `REFRESH_RACE`: the refresh token was rotated less than 30 seconds ago by a concurrent
        request. The session is still live; retry with the newest refresh token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LastSignInMethod:
      description: |
        `LAST_SIGN_IN_METHOD`: the change would leave the user without any way to sign in.
        Set a password (password reset) or add another sign-in method first.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: |
        `PAYLOAD_TOO_LARGE`: the request body or file is above the upload limit. Upload bodies are
        capped before they are read (`http.MaxBytesReader`; storage uploads use `STORAGE_MAX_BYTES`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SVGUnsafeContent:
      description: |
        `SVG_UNSAFE_CONTENT`: an SVG upload contains more than static vector content (script, event
        handler attributes, `javascript:` / external references, foreignObject, DOCTYPE/ENTITY,
        external CSS `url()` / `@import`). The file is rejected, never stripped;
        `error.details[0].message` holds the reason.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    WebhookEventDefinition:
      type: object
      required: [name, description_tr, description_en]
      properties:
        name: { type: string, example: lead.created }
        description_tr: { type: string }
        description_en: { type: string }

    WebhookEndpointInput:
      type: object
      required: [url, events]
      properties:
        url: { type: string, format: uri, example: "https://crm.example.com/hooks/comcode" }
        description: { type: string, maxLength: 500 }
        events:
          type: array
          minItems: 1
          items: { type: string, enum: [lead.created, card.scanned, order.created, order.status_changed] }
        is_active: { type: boolean, default: true }

    WebhookEndpoint:
      type: object
      required: [uuid, url, description, events, is_active, secret_hint, consecutive_failures, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        url: { type: string, format: uri }
        description: { type: string }
        events:
          type: array
          items: { type: string }
        is_active: { type: boolean }
        secret_hint: { type: string, description: Last characters of the signing secret }
        consecutive_failures: { type: integer }
        last_delivery_at: { type: string, format: date-time }
        last_success_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookEndpointWithSecret:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: "Shown once; `whsec_` + 64 hex characters", example: "whsec_0123…" }

    WebhookDelivery:
      type: object
      required: [uuid, event_name, event_id, payload, status, attempts, max_attempts, created_at]
      properties:
        uuid: { type: string, format: uuid }
        event_name: { type: string }
        event_id: { type: string, format: uuid, description: Shared by every endpoint's delivery of the same event }
        payload: { type: object, additionalProperties: true }
        status: { type: string, enum: [pending, succeeded, failed, exhausted] }
        attempts: { type: integer }
        max_attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time }
        last_status_code: { type: integer }
        last_error: { type: string }
        last_attempt_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    BillingPayment:
      type: object
      required: [uuid, kind, provider, amount_minor, currency, paid_at, receipt_number]
      properties:
        uuid: { type: string, format: uuid }
        kind: { type: string, enum: [subscription_checkout, subscription_renewal, subscription_upgrade, order, order_manual] }
        provider: { type: string, description: "paytr, iyzico, or the free text recorded by the platform for manual payments" }
        provider_ref: { type: string }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        paid_at: { type: string, format: date-time }
        plan_name: { type: string }
        billing_interval: { type: string }
        order_number: { type: string }
        order_uuid: { type: string, format: uuid }
        receipt_number: { type: string, example: RCP-3F2A9C1B7D4E }

    BillingSubscription:
      type: object
      required: [uuid, status, plan_uuid, plan_slug, plan_name, billing_interval, price_minor, currency, starts_at, cancel_at_period_end]
      properties:
        uuid: { type: string, format: uuid }
        status: { type: string, enum: [active, trialing, past_due] }
        plan_uuid: { type: string, format: uuid }
        plan_slug: { type: string }
        plan_name: { type: string }
        billing_interval: { type: string }
        price_minor: { type: integer, format: int64 }
        currency: { type: string }
        provider: { type: string }
        saved_card_uuid: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        next_billing_at: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        grace_until: { type: string, format: date-time }
        canceled_at: { type: string, format: date-time }
        cancel_at_period_end: { type: boolean }
        pending_plan_uuid: { type: string, format: uuid }

    EnvelopeGeneric:
      type: object
      required: [success, meta]
      properties:
        success: { type: boolean }
        data: {}
        meta: { $ref: "#/components/schemas/ResponseMeta" }


    SearchSpec:
      type: object
      required: [id, label_key]
      properties:
        id: { type: string, example: users }
        label_key: { type: string, example: search.specs.users }
        permission: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        searchable_fields:
          type: array
          items: { type: string }
        filterable_fields:
          type: array
          items: { type: string }
        account_scoped:
          type: boolean
          description: >-
            Hits are limited to the caller's active account (profiles, cards). Without an
            active account these specs return nothing.

    SearchHit:
      type: object
      required: [spec, id, title, href]
      properties:
        spec: { type: string }
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        href: { type: string }
        icon: { type: [string, "null"] }
        score: { type: [number, "null"], format: double }

    SearchSpecsData:
      type: object
      required: [items, enabled]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchSpec" }
