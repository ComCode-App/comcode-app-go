  /v1/billing/subscription:
    delete:
      tags: [Billing]
      operationId: deleteBillingSubscription
      summary: Schedule cancellation at the end of the paid period
      description: Requires app.billing.write and an owner/admin active account role. No step-up gate.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Cancellation scheduled (idempotent) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Billing]
      operationId: getBillingSubscription
      summary: Read the active account payment subscription
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Subscription or null
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  meta: { type: object, additionalProperties: true }
                  data:
                    type: object
                    required: [subscription]
                    properties:
                      subscription:
                        anyOf:
                          - { $ref: "#/components/schemas/BillingSubscription" }
                          - { type: 'null' }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/billing/subscription/resume:
    post:
      tags: [Billing]
      operationId: resumeBillingSubscription
      summary: Undo period-end cancellation before the period ends
      description: Requires app.billing.write and owner/admin account role. Does not restart an ended subscription.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Cancellation removed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/billing/subscription/plan:
    patch:
      tags: [Billing]
      operationId: changeBillingSubscriptionPlan
      summary: Upgrade with proration or schedule a downgrade
      description: Requires app.billing.write and owner/admin account role. Same-interval upgrades charge the remaining-time price difference rounded up to one minor unit. Downgrades apply at period end. Cross-interval changes are rejected.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_uuid]
              properties:
                plan_uuid: { type: string, format: uuid }
      responses:
        "204": { description: Plan changed or scheduled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

