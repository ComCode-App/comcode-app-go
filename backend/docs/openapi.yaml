        target_type:
          type: string
          enum: [profile, direct_url, vcard_download, social_hub]
          description: "profile, vcard_download and social_hub need profile_uuid; direct_url needs an https direct_url"
        profile_uuid: { type: string, format: uuid }
        direct_url: { type: string }
        presentation_config: { $ref: "#/components/schemas/SmartLinkPresentationConfig" }

    UpdateRouteInput:
