  /v1/platform/orders/{uuid}/manifest/export:
    post:
      tags: [Orders]
      operationId: postPlatformOrdersUuidManifestExport
      summary: Queue the production manifest export of an order
      description: |
        Production manifest (TEC-581): one row per provisioned card with order number, product,
        variant, SKU, recipient, card name, serial (UID), card code, the `/c/{code}` NFC/QR URL,
        activation code and card status. Runs as an export job (resource `platform.order_manifest`);
        download it from `/v1/platform/exports/{uuid}/download`. The file holds activation codes,
        so the route requires `platform.orders.read` and step-up.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format: { type: string, enum: [pdf, xlsx, csv, json] }
                locale: { type: string, enum: [tr, en], default: tr }
      responses:
        "202":
          description: Export job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeGeneric" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/platform/orders/{uuid}/manifest/qr-codes:
    get:
      tags: [Orders]
      operationId: getPlatformOrdersUuidManifestQrCodes
      summary: Download the QR print pack of an order
      description: |
        ZIP with one 1024px QR PNG per provisioned card (`001-{code}.png`, ...), each encoding the
        `/c/{code}` URL written to the card's NFC chip (TEC-581). Holds no activation codes.
        Requires `platform.orders.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: ZIP archive
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/public/leads/form:
    get:
      tags: [Leads]
      operationId: getPublicLeadForm
      summary: Whether a public path shows the lead form
      description: |
        No auth. `path` is the route the visitor came through: a username, `c/{code}` or
        `s/{slug}`. The form is on when the route is active and its `presentation_config.lead_capture.enabled`
        is true (cards: also the card's `lead_capture_enabled`, and the card must be active and unlocked).
        Unknown paths answer `enabled: false`. `consent_version` names the KVKK text the form must show.
        `exchange_enabled` (TEC-567) is true only for a profile's own path (its username) with
        `presentation_config.contact_exchange.enabled`; `exchange_consent_version` names the exchange
        KVKK text. A plan whose monthly quota (`leads.monthly_max` / `exchange.monthly_max`) is 0
        turns the form / the exchange off (TEC-941).
      security: []
      parameters:
        - { name: path, in: query, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          description: Form configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeLeadFormConfig" }

  /v1/public/leads:
    post:
      tags: [Leads]
      operationId: submitPublicLead
      summary: Leave contact details on a public profile, card or smart link
      description: |
        No auth; limited per client IP (429 with Retry-After). Needs a name, an email or a phone,
        `consent: true` and a known `consent_version`. The lead belongs to the account that owns the
        route; its owners and admins get a `leads.received` notification. A path whose form is off is 404.
        When `path` is the profile's own form, `via` (`c/{code}` or `s/{slug}`) attributes the lead to
        the card or smart link the visitor came through if it is live and opens the same profile, even
        when that route's own form is off (TEC-940); otherwise it is ignored.
        Monthly quota (TEC-941, `leads.monthly_max`): past it the lead is still stored (201) but
        `locked`, and the owner sees it masked; 0 turns the form off (404).
        Validation errors list each field in `error.details` (`code`: required, invalid, too_long,
        email_or_phone_required).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitLeadRequest" }
      responses:
        "201":
          description: Lead stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSubmitLeadResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/public/exchanges:
    post:
      tags: [Leads]
      operationId: submitContactExchange
      summary: Share your contact details with the owner of a profile page
      description: |
        Contact exchange (TEC-567). No auth; shares the per-IP limit of lead forms (429 with
        Retry-After). `path` is the profile page's username and needs contact exchange on
        (`LeadFormConfig.exchange_enabled`), else 404. `via` (`c/{code}` or `s/{slug}`) attributes the
        exchange to the card or smart link the visitor came through when it is live and opens the same
        profile; otherwise it is ignored. Needs a name, an email or a phone, `consent: true` and a known
        `exchange_consent_version`. The exchange is a lead of `kind: exchange` in the owner account's
        inbox; its owners and admins get a `leads.exchange_received` notification. When an email was
        given, the visitor gets a copy by email through the queue (TEC-940): what they shared, the
        owner's vCard attached and a KVKK delete link (see `POST /v1/public/exchanges/delete`).
        Monthly quota (TEC-941, `exchange.monthly_max`): past it the exchange is still stored but
        `locked`; 0 turns the exchange off (404).
        Validation errors list each field in `error.details`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactExchangeRequest" }
      responses:
        "201":
          description: Exchange stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSubmitLeadResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/public/exchanges/delete:
    post:
      tags: [Leads]
      operationId: deleteContactExchangeByToken
      summary: Delete an exchange with the link of its visitor copy email
      description: |
        KVKK "delete my data" (TEC-940). No auth; the signed `token` from the copy email's link is the
        credential (valid for a year). Deletes the exchange and the copy email row for good, so the
        link works once: a second use is 404. A malformed, forged or expired token is 400
        `INVALID_DELETE_TOKEN`. Shares the per-IP limit of lead forms. The frontend page posts the
        token on a click; opening the link alone never deletes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteContactExchangeRequest" }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeGeneric" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/exchanges:
    post:
      tags: [Leads]
      operationId: shareProfileExchange
      summary: Share one of your profiles with the owner of a profile page
      description: |
        Contact exchange for a signed-in visitor (TEC-567). Requires `app.profiles.read`. The profile
        must belong to the active account (404 otherwise); a plain member may share only a profile they
        own (403). The stored details are a snapshot of that profile: name, company and title from its
        primary translation, its first email and phone. Same availability, `via`, consent and limit
        rules as `POST /v1/public/exchanges`; the visitor copy goes to the caller's account email.
        409 `SELF_EXCHANGE` when the page belongs to the caller's own active account; 403 while
        impersonating.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareProfileExchangeRequest" }
      responses:
        "201":
          description: Exchange stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeSubmitLeadResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/webhooks/events:
    get:
      tags: [Webhooks]
      operationId: listWebhookEvents
      summary: Subscribable webhook events
      description: The registry of events an endpoint can subscribe to, with Turkish and English descriptions. `webhook.test` is sent by "send test" only.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Event registry
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  meta: { type: object, additionalProperties: true }
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/WebhookEventDefinition" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/webhooks:
    # Endpoints belong to the active account. Reads: app.webhooks.read (any member). Writes:
    # app.webhooks.write plus the owner/admin account role. At most 10 endpoints per account.
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List the active account's webhook endpoints
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Endpoints, newest first; the signing secret is never included
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  meta: { type: object, additionalProperties: true }
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/WebhookEndpoint" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Register a webhook endpoint
      description: The URL must be a public HTTPS address (private, loopback and link-local hosts are refused, also at dial time). The response carries the signing secret once; it is not retrievable later, only rotated.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEndpointInput" }
      responses:
        "201":
          description: Endpoint with its secret
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  meta: { type: object, additionalProperties: true }
                  data: { $ref: "#/components/schemas/WebhookEndpointWithSecret" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`WEBHOOK_LIMIT_REACHED`: the account already has 10 endpoints"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/webhooks/{uuid}:
    parameters:
      - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Webhooks]
      operationId: getWebhook
      summary: Read one endpoint
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Endpoint
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  meta: { type: object, additionalProperties: true }
                  data: { $ref: "#/components/schemas/WebhookEndpoint" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Webhooks]
      operationId: updateWebhook
      summary: Replace URL, description, events and active flag
      description: Re-activating an endpoint resets its consecutive failure counter. Deliveries already queued for a deactivated endpoint are marked exhausted when the worker picks them up.
