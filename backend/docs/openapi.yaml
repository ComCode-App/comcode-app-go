    PlatformAnalyticsOverview:
      type: object
      required: [generated_at, time_zone, days, today, last_7_days, last_30_days, daily, unique_visitors, top_event_types]
      properties:
        generated_at: { type: string, format: date-time }
        time_zone: { type: string, example: Europe/Istanbul }
        days: { type: integer, example: 30, description: Length of the daily series }
        today: { type: integer, description: Events of the current local day so far }
        last_7_days: { type: integer, description: "Last 7 local days, today included" }
        last_30_days: { type: integer, description: "Last 30 local days, today included" }
        daily:
          type: array
          description: One point per local day, oldest first, zero for days without events
          items:
            type: object
            required: [date, count]
            properties:
              date: { type: string, format: date }
              count: { type: integer }
        unique_visitors:
          type: object
          description: |
            Distinct visitors (session id, else the rotating IP hash) over the same local-day
            windows, from the hourly visitor rollup. A visitor without a session counts again
            after an IP salt rotation.
          required: [today, last_7_days, last_30_days]
          properties:
            today: { type: integer }
            last_7_days: { type: integer }
            last_30_days: { type: integer }
        top_event_types:
          type: array
          description: The 10 most frequent event types of the 30-day window, most frequent first
          items:
            type: object
            required: [event_type, count]
            properties:
              event_type: { type: string }
              count: { type: integer }

    EnvelopePlatformAnalyticsOverview:
      type: object
      required: [success, data, meta]
