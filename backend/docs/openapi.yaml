      description: Only owners grant or revoke the owner role. The last owner cannot be demoted (409).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
