      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteQRStyle" }
      responses:
        "200":
          description: QR configuration saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeRouteQR" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/routes/{uuid}/qr/render:
    get:
      tags: [Global Routes]
      operationId: renderRouteQR
      summary: Download a branded QR file
      description: >-
        Requires app.routes.read in the active account. Files encode the same marked route identity
        as new production manifest QR PNGs, never the mutable destination. Size must also provide
        at least four pixels per module including the quiet zone. PDF places the PNG on A4 at 160 mm.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
        - name: format
          in: query
          schema: { type: string, enum: [svg, png, pdf], default: png }
        - name: size
          in: query
          description: Image edge in pixels; SVG uses this width/height and PDF embeds this raster resolution.
          schema: { type: integer, minimum: 256, maximum: 2048, default: 1024 }
      responses:
        "200":
          description: File attachment with private no-store caching
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            image/svg+xml:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/routes/{uuid}/qr/preview:
    post:
      tags: [Global Routes]
      operationId: previewRouteQR
      summary: Preview an unsaved QR style with the server renderer
      description: >-
        Requires app.routes.read in the active account; nothing is stored, so no owner/admin role is
        needed. Renders the request body style with the same renderer as /qr/render and the print
        pack, so the editor shows exactly what will be printed. Validation matches PUT /qr: logos
        reference a same-account profile avatar or cover (API-owned media, never a URL). Body is
        capped at 4 KiB and unknown fields are rejected. Limited per user (429 with Retry-After).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
        - name: format
          in: query
          schema: { type: string, enum: [svg, png], default: png }
        - name: size
          in: query
          description: Image edge in pixels; previews are capped below the download maximum.
          schema: { type: integer, minimum: 256, maximum: 1024, default: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteQRStyle" }
      responses:
        "200":
          description: Inline image with private no-store caching
          content:
            image/svg+xml:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

