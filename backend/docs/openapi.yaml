    SubmitLeadRequest:
      type: object
      required: [path, name, consent, consent_version]
      properties:
        path: { type: string, maxLength: 128 }
        via: { type: string, maxLength: 128, description: "c/{code} or s/{slug} that opened the profile page" }
        name: { type: string, maxLength: 150 }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 32 }
        message: { type: string, maxLength: 2000 }
        locale: { type: string, enum: [tr, en] }
