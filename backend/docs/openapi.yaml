    delete:
      tags: ["App"]
      operationId: "deleteCompanyMedia"
      summary: "Delete a file from the company media library"
      description: "TEC-946. Owner/admin. A file still used as the branding logo/cover or as a profile avatar/cover is refused with 409; error.details lists the usages (field = usage type, or usage type:profile uuid)."
      security: [{"bearerAuth": []}]
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
