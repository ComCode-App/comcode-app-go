        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/account/invites/{uuid}:
    delete:
      tags: [Accounts]
      operationId: revokeActiveAccountInvite
      summary: Revoke an open invite
      description: The link stops working. A profile the employee import created for it stays in the account.
