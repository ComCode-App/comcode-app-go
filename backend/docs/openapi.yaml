  /v1/company/analytics/summary:
    get:
      tags: ["App"]
      operationId: "getCompanyAnalyticsSummary"
      summary: "Company analytics totals"
      description: |
        Requires app.company_analytics.read and an active company account (TEC-574). Owner/admin
        see the whole company; office_manager only profiles linked to members of granted offices;
        members and personal accounts get 403. Sums event_aggregates_daily of the company's live
        profiles, routes and cards (attributed to the profile each currently points at) plus leads.
        Without office/group filter, owners/admins also get subjects that point at no profile
        (e.g. a smart link to a URL). `from` is clamped to the plan's `analytics.history_days`
        (returned as `history_days` and `X-Analytics-History-Days`).
      security: [{"bearerAuth": []}]
      parameters: [{"$ref": "#/components/parameters/CompanyAnalyticsFrom"}, {"$ref": "#/components/parameters/CompanyAnalyticsTo"}, {"name": "office_uuid", "in": "query", "schema": {"type": "string", "format": "uuid"}}, {"name": "group_uuid", "in": "query", "schema": {"type": "string", "format": "uuid"}}]
      responses:
        200:
          description: "Totals, top event types and profile counts"
          headers:
            X-Analytics-History-Days:
              description: "The plan's history window in days; absent when unlimited"
              schema: {"type": "integer"}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCompanyAnalyticsSummary"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
  /v1/company/analytics/timeseries:
    get:
      tags: ["App"]
      operationId: "getCompanyAnalyticsTimeSeries"
      summary: "Company analytics daily series"
      description: "Same access, scope and clamp as the summary. One zero-filled point per UTC day of the range, with the full metric set."
      security: [{"bearerAuth": []}]
      parameters: [{"$ref": "#/components/parameters/CompanyAnalyticsFrom"}, {"$ref": "#/components/parameters/CompanyAnalyticsTo"}, {"name": "office_uuid", "in": "query", "schema": {"type": "string", "format": "uuid"}}, {"name": "group_uuid", "in": "query", "schema": {"type": "string", "format": "uuid"}}]
      responses:
