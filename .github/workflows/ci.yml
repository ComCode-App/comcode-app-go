name: CI

# Runs on the self-hosted macOS runner (labels: self-hosted, comcode).
# Runner lives in ~/actions-runner-comcode as a launchd service — see docs/DEVELOPMENT.md#ci.
# Toolchains and module/pnpm stores persist on the host, so remote caches are disabled.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: [self-hosted, comcode]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      PG_CONTAINER: comcode-ci-pg-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: sqlc generate
        run: sqlc generate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend
          skip-cache: true
      # Postgres for the integration tests (internal/testutil/pgtest). Fixed high port, throwaway
      # data on tmpfs; removed in the always() step below.
      - name: Start test Postgres
        run: |
          docker rm -f "$PG_CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$PG_CONTAINER" \
            -e POSTGRES_USER=comcode -e POSTGRES_PASSWORD=comcode -e POSTGRES_DB=comcode_test \
            -p 127.0.0.1:56432:5432 --tmpfs /var/lib/postgresql \
            postgres:18-alpine -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for i in $(seq 1 60); do
            docker exec "$PG_CONTAINER" pg_isready -h 127.0.0.1 -U comcode -d comcode_test >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs "$PG_CONTAINER"
          exit 1
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://comcode:comcode@127.0.0.1:56432/comcode_test?sslmode=disable
        run: |
          # -coverpkg: integration tests in usecase packages also cover the repositories they drive.
          go test -coverpkg=./... -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | tail -1 | tr -s '[:space:]' ' ')
          echo "$total"
          printf '### Backend coverage\n\n`%s`\n' "$total" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove test Postgres
        if: always()
        run: docker rm -f "$PG_CONTAINER" || true
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@1 lint docs/openapi.yaml
      - name: OpenAPI matches live routes
        run: python3 scripts/openapi_routes.py

  frontend:
    runs-on: [self-hosted, comcode]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: i18n
        working-directory: .
        run: node scripts/check-i18n.mjs

  e2e:
    runs-on: [self-hosted, comcode]
    timeout-minutes: 40
    env:
      # Unique compose project, container and volume names per run; scripts/e2e.sh removes them on exit.
      E2E_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: Playwright smoke tests
        run: scripts/e2e.sh
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/e2e/.state/logs
          retention-days: 7
