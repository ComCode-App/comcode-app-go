name: CI

# GitHub-hosted runners (ubuntu-24.04) with remote caches (Go modules/build,
# pnpm store, golangci-lint, Playwright browsers, buildx type=gha).
# See docs/DEVELOPMENT.md#ci.
#
# Triggers: pushes to main and to the integration branch cc-collective-branch,
# every pull request (any base) and manual runs. Feature branches are tested
# through their pull request, so there is no push trigger for them (that only
# duplicated the runs).
#
# Releases (TEC-1094): ONLY a push to main publishes images to GHCR
# (:main, :sha-<short>, :v0.N) and cuts the v0.N git tag Dokploy deploys
# (release-meta -> publish-images -> release-tag). Every other ref builds the
# images without pushing. The one exception is a manual run of a non-main ref
# with push_test_image=true, which pushes :test-<short-sha> and nothing else.
on:
  push:
    branches: [main, cc-collective-branch]
  pull_request:
  workflow_dispatch:
    inputs:
      push_test_image:
        description: "Also push every image as :test-<short-sha> to GHCR (refused on main; never :main / :v0.* / :sha-*)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Branches and PRs: newest push wins. main: never cancel mid-run, or a
  # publish could land without its v0.N tag (and release numbers could skip).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Path filter. Plain `git diff` (no third-party action) decides which jobs
  # run. Outputs gate every downstream job. Mapping (first match wins):
  #   docs/** , *.md , .github/* (other than this file) -> nothing
  #   deploy/env/**          -> nothing in this table (env only, see below)
  #   compose.prod.yml , deploy/** , Dockerfiles        -> infra (image build)
  #   backend/cmd/** , backend/deploy/** , go.mod/go.sum -> backend + infra
  #   frontend package.json / pnpm-lock.yaml / next.config.* -> frontend + infra
  #   backend/migrations/**  -> backend + infra
  #   backend/**             -> backend, contracts
  #   frontend/**            -> frontend, contracts
  #   scripts/check-i18n.mjs -> frontend
  #   scripts/e2e.sh , compose.local.yml , .env.example -> e2e
  #   mobile/**              -> mobile, mobile_release (only used when the
  #                             MOBILE_ENABLED repo variable is 'true')
  #   this workflow file     -> full (run everything)
  # Separately, `env` (the env job, docs/design/env-core.md) is set by
  # deploy/env/**, compose*.yml, .env.example, .env.server.example, Makefile,
  # the env scripts (scripts/prod-env*.sh, check-env-sync.sh, check-compose-env*.sh),
  # backend/internal/config/**, and any backend Go diff line that adds or
  # removes an env read (getEnv/getInt/.../os.Getenv/os.LookupEnv).
  # Diff base: pull_request -> the PR base; push to cc-collective-branch -> the
  # previous push (fallback: merge-base with main, else full). push to main and
  # workflow_dispatch -> full, so main is never green on skipped tests.
  # `images` echoes deploy/images.json so image-build can matrix over every
  # build-context service without hardcoding backend+frontend.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      contracts: ${{ steps.f.outputs.contracts }}
      e2e: ${{ steps.f.outputs.e2e }}
      env: ${{ steps.f.outputs.env }}
      infra: ${{ steps.f.outputs.infra }}
      mobile: ${{ steps.f.outputs.mobile }}
      full: ${{ steps.f.outputs.full }}
      mobile_release: ${{ steps.f.outputs.mobile_release }}
      images: ${{ steps.f.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          backend=false; frontend=false; contracts=false; e2e=false
          env=false; infra=false; mobile=false; full=false
          files=""

          # main: the diff (BEFORE..SHA) only decides mobile_release; every
          # main push runs the full suite (forced below).
          base=""
          main_push=false
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push)
              base="$BEFORE"
              [ "$REF" = "refs/heads/main" ] && main_push=true
              ;;
            *) full=true ;;   # workflow_dispatch: build everything
          esac

          if [ "$full" != "true" ]; then
            if [ -z "$base" ] \
               || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              # New branch or the before-commit is not in history: diff against
              # the merge-base with main; if that is unknown, treat as full.
              base=""
              if git fetch --no-tags --quiet origin main 2>/dev/null; then
                base="$(git merge-base FETCH_HEAD "$SHA" 2>/dev/null || true)"
              fi
            fi
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              full=true
            else
              files="$(git diff --name-only "$base" "$SHA")"
            fi
          fi

          # The workflow file changing means "re-run everything".
          if [ "$full" != "true" ] && grep -qx '.github/workflows/ci.yml' <<< "$files"; then
            full=true
          fi

          if [ "$full" != "true" ] && [ -n "$files" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              # Order matters: first match wins (case globs, * spans '/').
              case "$file" in
                docs/*|*.md|.github/*)              : ;;   # nothing (before app dirs: backend/*.md is docs)
                deploy/env/*)                       : ;;   # env only (set below), no image build
                compose.prod.yml|deploy/*)          infra=true ;;
                */Dockerfile|Dockerfile)            infra=true ;;
                # Image-shaping files outside the Dockerfile: the build loop
                # (backend/cmd), the entrypoint, and the dependency manifests.
                backend/cmd/*|backend/deploy/*|backend/go.mod|backend/go.sum)
                                                    backend=true; contracts=true; infra=true ;;
                frontend/package.json|frontend/pnpm-lock.yaml|frontend/next.config.*)
                                                    frontend=true; contracts=true; infra=true ;;
                backend/migrations/*)               backend=true; contracts=true; infra=true ;;
                backend/*)                          backend=true; contracts=true ;;
                frontend/*)                         frontend=true; contracts=true ;;
                scripts/check-i18n.mjs)             frontend=true ;;
                scripts/e2e.sh|compose.local.yml|.env.example)
                                                    e2e=true ;;
                mobile/*)                           mobile=true ;;
                *)                                  : ;;   # unmapped -> nothing
              esac
            done <<< "$files"
          fi

          # env: the env schema, its scripts, compose files and backend env reads.
          if [ "$full" != "true" ] && [ -n "$files" ]; then
            while IFS= read -r file; do
              case "$file" in
                deploy/env/*|compose*.yml|.env.example|.env.server.example|Makefile) env=true ;;
                scripts/prod-env*.sh|scripts/check-env-sync.sh|scripts/check-compose-env*.sh) env=true ;;
                backend/internal/config/*) env=true ;;
              esac
            done <<< "$files"
            if [ "$env" != "true" ] && git diff "$base" "$SHA" -- 'backend/*.go' \
                 | grep -E '^[-+].*\b(getEnv|getInt|getInt64|getBool|getDuration|getFloat|os\.Getenv|os\.LookupEnv)\(' >/dev/null; then
              # (grep without -q reads the whole diff: no SIGPIPE under pipefail)
              env=true
            fi
          fi

          if [ "$full" = "true" ] || [ "$main_push" = "true" ]; then
            backend=true; frontend=true; contracts=true; e2e=true; env=true; infra=true; mobile=true
          fi
          # E2E drives the real API + Next.js build: any app change re-runs it.
          if [ "$backend" = "true" ] || [ "$frontend" = "true" ]; then
            e2e=true
          fi

          # mobile_release: ONLY a real (non-doc) mobile/** diff. Never set by
          # `full`, and never by backend/docs/openapi.yaml — see the mobile job.
          mobile_release=false
          if [ -n "$files" ]; then
            while IFS= read -r file; do
              case "$file" in
                *.md) ;;
                mobile/*) mobile_release=true ;;
              esac
            done <<< "$files"
          fi

          images="$(jq -c '.images' deploy/images.json)"

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "contracts=$contracts"
            echo "e2e=$e2e"
            echo "env=$env"
            echo "infra=$infra"
            echo "mobile=$mobile"
            echo "full=$full"
            echo "mobile_release=$mobile_release"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"

          echo "backend=$backend frontend=$frontend contracts=$contracts e2e=$e2e env=$env infra=$infra mobile=$mobile full=$full mobile_release=$mobile_release"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    # Postgres for the integration tests (internal/testutil/pgtest). Throwaway
    # data on tmpfs; durability is switched off in the "Tune test Postgres" step.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: comcode
          POSTGRES_PASSWORD: comcode
          POSTGRES_DB: comcode_test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U comcode -d comcode_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: gofmt
        # Every Go file, sqlc output included (sqlc emits gofmt-clean code).
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error title=gofmt::Run 'gofmt -w' on these files:"
            echo "$unformatted"
            exit 1
          fi
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: sqlc generate
        run: sqlc generate
      - name: sqlc output is committed
        run: |
          if ! git diff --exit-code -- internal/database/db || [ -n "$(git status --porcelain -- internal/database/db)" ]; then
            echo "::error title=Stale sqlc output::Run 'sqlc generate' in backend/ and commit internal/database/db."
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: backend
      - name: Tune test Postgres
        # Service containers take no server flags; these settings reload without a restart.
        env:
          PG_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_ID" psql -U comcode -d comcode_test -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://comcode:comcode@127.0.0.1:5432/comcode_test?sslmode=disable
        run: |
          # -coverpkg: integration tests in usecase packages also cover the repositories they drive.
          go test -coverpkg=./... -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | tail -1 | tr -s '[:space:]' ' ')
          echo "$total"
          printf '### Backend coverage\n\n`%s`\n' "$total" >> "$GITHUB_STEP_SUMMARY"
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@1 lint docs/openapi.yaml
      - name: OpenAPI matches live routes
        run: python3 scripts/openapi_routes.py

  # Runs on a frontend change OR a contract change (backend/** sets contracts),
  # so a backend API edit re-verifies the committed frontend client.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1 # same as frontend/Dockerfile
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Unit tests
        run: pnpm test
      - name: i18n
        working-directory: .
        run: node scripts/check-i18n.mjs

  # Env config (docs/design/env-core.md): .env.server.example matches
  # deploy/env/schema, .env.example has every schema key, every backend env
  # read is in the schema, prod-env tests pass (they also run `docker compose
  # config` on compose.prod.yml), and every backend env read reaches the
  # backend/worker containers. Same as `make env-check`.
  env:
    needs: changes
    if: needs.changes.outputs.env == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Env schema sync
        run: scripts/check-env-sync.sh
      - name: Backend env reaches compose.prod.yml
        run: |
          scripts/check-compose-env.sh
          scripts/check-compose-env.test.sh

  # Playwright smoke suite against a throwaway stack (scripts/e2e.sh): infra from
  # compose.local.yml, the Go API built from source, the production Next.js build.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Unique compose project, container and volume names per run; scripts/e2e.sh removes them on exit.
      E2E_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1 # same as frontend/Dockerfile
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Playwright smoke tests
        run: scripts/e2e.sh
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/e2e/.state/logs
          retention-days: 7

  # Build every build-context image (deploy/images.json), NO push. Runs on any
  # app or infra change of a PR / non-main push / manual run (docs-only changes
  # skip it); the per-image gha cache keeps the untouched image near-instant.
  # There is no registry login here and push is hardcoded false. On main the
  # images are built by publish-images instead. Non-release builds bake the
  # version sha-<short>.
  image-build:
    needs: changes
    if: >-
      ( github.event_name != 'push' || github.ref != 'refs/heads/main' ) &&
      ( needs.changes.outputs.infra == 'true' ||
        needs.changes.outputs.full == 'true' ||
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        run: |
          echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build ${{ matrix.image.service }} (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.dockerfile }}
          push: false
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ steps.meta.outputs.built_at }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.built_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.service }}

  # ---------------------------------------------------------------------------
  # Releases (TEC-1094). main push ONLY. Three layers keep any other ref from
  # pushing :main / :v0.* / :sha-* or cutting a tag:
  #   1. job `if:` requires event push + ref refs/heads/main;
  #   2. the step that computes tags hard-fails on any other ref/event;
  #   3. packages/contents write permissions exist only on these jobs.
  # publish-images has no always(): GitHub's implicit success() means EVERY
  # needed job (backend, frontend, e2e, env, release-meta) must be `success`.
  # A skipped test job is not success, so untested code is never published.
  # (Every main push runs the full suite: see the changes job.)
  # ---------------------------------------------------------------------------

  # Decide the release ONCE, before any image is built, so every image bakes
  # the same provenance and release-tag cuts exactly this version.
  #   version  v0.N, N = highest existing v0.<int> tag + 1 (v0.1 when there is
  #            none; a v0.0 baseline tag created by the owner also gives v0.1)
  #   notes    `git log --no-merges` since the previous v0.* tag (capped at 200
  #            lines); there is no hand-kept CHANGELOG
  #   release  base64 release.json {version, git_commit, built_at, notes}; the
  #            backend embeds it (internal/platform/release) and upserts it into
  #            app_releases on boot
  release-meta:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.m.outputs.version }}
      built_at: ${{ steps.m.outputs.built_at }}
      release_b64: ${{ steps.m.outputs.release_b64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "push" ] || [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=Not a release ref::release-meta only runs for a push to main (got $EVENT $REF)."
            exit 1
          fi
          git fetch --tags --force --quiet
          last="$(git tag -l 'v0.*' | sed -n 's/^v0\.\([0-9]\+\)$/\1/p' | sort -n | tail -1)"
          version="v0.$(( ${last:-0} + 1 ))"
          if [ -n "$last" ]; then
            range="v0.${last}..${GITHUB_SHA}"; since="since v0.${last}"
          else
            range="${GITHUB_SHA}"; since="(first release)"
          fi
          log="$(git log --no-merges --pretty='- %s (%h)' "$range")"
          total="$(printf '%s' "$log" | grep -c '^- ' || true)"
          notes="$(printf '%s\n' "$log" | head -n 200)"
          if [ "${total:-0}" -gt 200 ]; then
            notes="${notes}"$'\n'"- ...and $(( total - 200 )) more commits ${since}."
          fi
          [ -n "$log" ] || notes="- No code changes ${since} (redeploy)."
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          release_b64="$(jq -nc --arg v "$version" --arg c "$GITHUB_SHA" --arg b "$built_at" --arg n "$notes" \
            '{version:$v, git_commit:$c, built_at:$b, notes:$n}' | base64 -w0)"
          {
            echo "version=$version"
            echo "built_at=$built_at"
            echo "release_b64=$release_b64"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release $version ($since)"
            echo
            echo "$notes"
          } >> "$GITHUB_STEP_SUMMARY"

  # Green main push: build + push every image in deploy/images.json to GHCR as
  # :main (mutable, newest build), :sha-<short> and :v0.N. The image path is
  # derived from the repository, lowercased (ghcr.io/<owner>/<repo>-<service>,
  # here ghcr.io/comcode-app/comcode-app-go-backend), never a hardcoded app
  # name. Provenance goes in as build args (APP_VERSION, APP_COMMIT,
  # APP_BUILT_AT, APP_RELEASE_JSON_B64) and OCI labels on every image.
  publish-images:
    needs: [changes, backend, frontend, e2e, env, release-meta]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        name: Compute tags (main push only)
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          VERSION: ${{ needs.release-meta.outputs.version }}
          SERVICE: ${{ matrix.image.service }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "push" ] || [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=Refusing to publish::release tags are only pushed from a push to main (got $EVENT $REF)."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^v0\.[0-9]+$ ]]; then
            echo "::error title=Bad version::release-meta returned '$VERSION', expected v0.N."
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${SERVICE}"   # ghcr.io requires lowercase
          short="${GITHUB_SHA::7}"
          {
            echo "image=$image"
            echo "tags<<EOF"
            echo "$image:main"
            echo "$image:sha-$short"
            echo "$image:$VERSION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ needs.release-meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ needs.release-meta.outputs.built_at }}
            APP_RELEASE_JSON_B64=${{ needs.release-meta.outputs.release_b64 }}
          labels: |
            org.opencontainers.image.version=${{ needs.release-meta.outputs.version }}
            org.opencontainers.image.created=${{ needs.release-meta.outputs.built_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.service }}

  # Every image is on GHCR -> cut the version release-meta chose (the one baked
  # into the images) as an annotated tag whose message is the release notes.
  # Dokploy deploys v0.* tags; the backend then upserts the release into
  # app_releases on boot. A re-run that finds the tag on this commit is a no-op.
  release-tag:
    needs: [release-meta, publish-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag ${{ needs.release-meta.outputs.version }}
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TAG: ${{ needs.release-meta.outputs.version }}
          RELEASE_B64: ${{ needs.release-meta.outputs.release_b64 }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "push" ] || [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=Refusing to tag::v0.* tags are only cut from a push to main (got $EVENT $REF)."
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v0\.[0-9]+$ ]]; then
            echo "::error title=Bad version::release-meta returned '$TAG', expected v0.N."
            exit 1
          fi
          git fetch --tags --force --quiet
          if existing="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}")"; then
            if [ "$existing" = "$GITHUB_SHA" ]; then
              echo "$TAG already points at ${GITHUB_SHA::7} (re-run); nothing to do."
              exit 0
            fi
            echo "::error title=Tag taken::$TAG already exists at ${existing::7}, but the images were baked as $TAG for ${GITHUB_SHA::7}. Re-run the whole workflow so release-meta picks the next number."
            exit 1
          fi
          notes="$(printf '%s' "$RELEASE_B64" | base64 -d | jq -r '.notes')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" -m "$notes" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Tagged **$TAG** at \`${GITHUB_SHA::7}\`. Dokploy deploys v0.* tags." >> "$GITHUB_STEP_SUMMARY"

  # Manual trial push from a NON-main ref: Actions -> CI -> Run workflow, pick
  # the branch, tick push_test_image. Pushes ONLY :test-<short-sha> (never
  # :main, :v0.* or :sha-*) and only after the full suite passed (a manual run
  # is always full). Refused on main by the job `if:` and again by the step.
  publish-test-image:
    needs: [changes, backend, frontend, e2e, env]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.push_test_image == true &&
      github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        name: Compute test tag (non-main manual run only)
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SERVICE: ${{ matrix.image.service }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "workflow_dispatch" ] || [ "$REF" = "refs/heads/main" ]; then
            echo "::error title=Refusing test push::test images are only pushed from a manual run of a non-main ref (got $EVENT $REF)."
            exit 1
          fi
          version="test-${GITHUB_SHA::7}"
          {
            echo "version=$version"
            echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}-${SERVICE}:$version"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image.service }} (${{ steps.meta.outputs.version }})
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ steps.meta.outputs.built_at }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.built_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image.service }}

  # ---------------------------------------------------------------------------
  # Mobile (Expo). OFF unless the repo variable MOBILE_ENABLED is 'true'
  # (Settings -> Secrets and variables -> Actions -> Variables). ComCode has no
  # mobile/ yet; even when enabled, the jobs skip green until
  # mobile/package.json exists.
  #
  # OpenAPI -> mobile DECOUPLING (the fix for spurious app releases):
  # The mobile client types are COMMITTED (mobile/src/core/api/schema.d.ts,
  # generated by a version-PINNED openapi-typescript from
  # backend/docs/openapi.yaml). The release trigger is mobile/** ONLY
  # (changes.outputs.mobile_release), never backend/docs/openapi.yaml.
  # openapi-typescript output is deterministic, so a backend change that does
  # not alter the API surface regenerates an identical schema.d.ts -> no
  # mobile/** diff -> no release. A real API change shows up as a committed
  # schema.d.ts diff, which IS a mobile/** change and does release.
  #
  # This job (verification, never a release) also runs on backend changes so
  # an API edit that forgot to regenerate the committed types fails here
  # ("api:generate is up to date") instead of drifting silently.
  # ---------------------------------------------------------------------------
  mobile:
    needs: changes
    if: >-
      vars.MOBILE_ENABLED == 'true' &&
      ( needs.changes.outputs.mobile == 'true' || needs.changes.outputs.backend == 'true' )
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - id: guard
        run: |
          if [ -f mobile/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Mobile CI skipped: \`mobile/package.json\` does not exist yet." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ hashFiles('mobile/.nvmrc') != '' && 'mobile/.nvmrc' || 'frontend/.nvmrc' }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        if: steps.guard.outputs.present == 'true'
        working-directory: mobile
        run: npm ci
      - name: Generator is pinned
        if: steps.guard.outputs.present == 'true'
        working-directory: mobile
        run: |
          # Stable output needs an exact openapi-typescript version (no ^ / ~).
          node -e '
            const p = require("./package.json");
            const v = (p.devDependencies || {})["openapi-typescript"] || (p.dependencies || {})["openapi-typescript"];
            if (!v) { console.error("::error::openapi-typescript is not a mobile dependency"); process.exit(1); }
            if (!/^\d+\.\d+\.\d+$/.test(v)) { console.error(`::error::pin openapi-typescript to an exact version (found "${v}")`); process.exit(1); }
            console.log(`openapi-typescript pinned at ${v}`);
          '
      - name: Lint
        if: steps.guard.outputs.present == 'true'
        working-directory: mobile
        run: npm run lint
      - name: Typecheck
        if: steps.guard.outputs.present == 'true'
        working-directory: mobile
        run: npm run typecheck
      - name: Test
        if: steps.guard.outputs.present == 'true'
        working-directory: mobile
        run: npm test --if-present
      - name: api:generate is up to date
        if: steps.guard.outputs.present == 'true'
        working-directory: mobile
        run: |
          npm run api:generate
          if ! git diff --exit-code -- src/core/api/ || [ -n "$(git status --porcelain -- src/core/api/)" ]; then
            echo "::error title=Stale mobile API types::Run 'npm run api:generate' in mobile/ and commit src/core/api/schema.d.ts."
            exit 1
          fi

  # EAS release on a green main push, ONLY when MOBILE_ENABLED is 'true' and
  # mobile/** really changed (changes.outputs.mobile_release). Skips green with
  # a summary note when mobile/ is absent, EXPO_TOKEN is unset, or app.json has
  # no EAS projectId.
  mobile-release:
    needs: [changes, backend, frontend, mobile]
    if: >-
      always() &&
      vars.MOBILE_ENABLED == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.mobile_release == 'true' &&
      needs.backend.result != 'failure' &&
      needs.backend.result != 'cancelled' &&
      needs.frontend.result != 'failure' &&
      needs.frontend.result != 'cancelled' &&
      needs.mobile.result != 'failure' &&
      needs.mobile.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: guard
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_RELEASE: ${{ needs.changes.outputs.mobile_release }}
        run: |
          skip() { echo "ship=false" >> "$GITHUB_OUTPUT"; echo "Mobile release skipped: $1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          [ -f mobile/package.json ] || skip "\`mobile/\` does not exist yet."
          [ "$MOBILE_RELEASE" = "true" ] || skip "no \`mobile/**\` change in this push (backend / OpenAPI edits never ship the app)."
          [ -n "$EXPO_TOKEN" ] || skip "\`EXPO_TOKEN\` secret is not set."
          pid="$(jq -r '.expo.extra.eas.projectId // empty' mobile/app.json 2>/dev/null || true)"
          [ -n "$pid" ] || skip "\`mobile/app.json\` has no \`expo.extra.eas.projectId\` (run \`eas init\`)."
          echo "ship=true" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.ship == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ hashFiles('mobile/.nvmrc') != '' && 'mobile/.nvmrc' || 'frontend/.nvmrc' }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - if: steps.guard.outputs.ship == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install
        if: steps.guard.outputs.ship == 'true'
        working-directory: mobile
        run: npm ci
      - name: EAS build (production, all platforms)
        if: steps.guard.outputs.ship == 'true'
        working-directory: mobile
        run: |
          eas build --platform all --profile production --non-interactive --no-wait
          echo "EAS production build queued for \`${GITHUB_SHA::7}\`." >> "$GITHUB_STEP_SUMMARY"

  # DISABLED (`if: false`). Ported from the boilerplate, where a green feature
  # branch is auto-merged into main. In ComCode every change goes through a pull
  # request into cc-collective-branch and the owner merges into main by hand, so
  # auto-merge to main stays off. To re-enable, replace `if: false` with the
  # condition below and add a `push` trigger for feature branches:
  #   always() && github.event_name == 'push' && github.ref_name != 'main' &&
  #   !contains(github.event.head_commit.message, '[no-automerge]') &&
  #   needs.changes.result == 'success' &&
  #   needs.backend.result != 'failure' && needs.frontend.result != 'failure' &&
  #   needs.backend.result != 'cancelled' && needs.frontend.result != 'cancelled'
  # Token: repo secret AUTO_PR_TOKEN (fine-grained PAT: contents + pull requests
  # read/write), else GITHUB_TOKEN with "Allow GitHub Actions to create and
  # approve pull requests". Not part of the `ci` gate.
  auto-pr:
    needs: [changes, backend, frontend]
    if: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.AUTO_PR_TOKEN || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      BASE: main
    steps:
      - name: Open or reuse pull request
        id: pr
        run: |
          ahead="$(gh api "repos/$GH_REPO/compare/$BASE...$GITHUB_SHA" --jq '.ahead_by')"
          if [ "$ahead" = "0" ]; then
            echo "Branch has nothing that is not already in $BASE; skipping."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number="$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            title="$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]')"
            if ! url="$(gh pr create --base "$BASE" --head "$BRANCH" --title "$title" \
              --body "Otomatik açıldı: \`$BRANCH\` dalında CI (backend + frontend) başarılı." 2>&1)"; then
              echo "$url"
              exit 1
            fi
            number="${url##*/}"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Merge
        if: steps.pr.outputs.number != ''
        run: |
          # Only merge the commit this run tested (--match-head-commit).
          gh pr merge "${{ steps.pr.outputs.number }}" --merge --match-head-commit "$GITHUB_SHA"

  # Single required status check. Passes when every gated job is success or
  # skipped (path-filtered, mobile gated off by MOBILE_ENABLED, release jobs
  # off main, the test push when not requested); fails if any failed or was
  # cancelled. On main a failed publish or tag therefore turns the run red.
  # Make THIS the required check in branch protection (not the individual
  # jobs, which skip by design).
  ci:
    if: always()
    needs: [changes, backend, frontend, e2e, env, image-build, release-meta, publish-images, release-tag, publish-test-image, mobile, mobile-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Needed job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error title=CI gate failed::A required job reported '$r'."; exit 1 ;;
            esac
          done
          echo "All required jobs passed or were skipped."
